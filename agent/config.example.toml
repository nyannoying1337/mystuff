[worker]
# Where the Cloudflare Worker runs.
url = "https://status-api.nyannoying.de"
# Same value you set with: npx wrangler secret put PUSH_TOKEN
token = "change-me"

[agent]
# How often to push while you're in game, and while you're not.
interval_seconds = 10
offline_interval_seconds = 60

[source]
# "mod"  — singleplayer: the mc-status Fabric mod writes your state, and runs
#          curses in your world. Needs the mod installed.
# "rcon" — a server you run: the agent asks it over RCON (see [rcon]).
type = "mod"
# Where the game lives. Default: %APPDATA%/.minecraft on Windows, ~/.minecraft elsewhere.
# game_dir = "%APPDATA%/.minecraft"

[rcon]
# Only used with source.type = "rcon".
host = "127.0.0.1"
port = 25575
password = "your-rcon-password"
# Exact in-game name. RCON only works on servers you control.
player = "nyannoying"

[screenshot]
# With the mod, its small HUD-free frames in <game_dir>/mc-status are used and
# F2 screenshots are never published. Set a folder here to override that.
# directory = "~/.minecraft/screenshots"
max_width = 1280
quality = 78

[map]
# When you log out, render the area around where you were and publish it to
# the repo's `map` branch (see map/render.py). Needs Java 25+ and git push access.
render_on_logout = false
radius_chunks = 8
# BlueMap downloads textures from the Minecraft client jar. Setting this means
# you own the game and accept Mojang's EULA (https://www.minecraft.net/eula).
accept_mojang_eula = false
publish = true
# Found automatically (JAVA_HOME, PATH, or the Minecraft launcher's own Java).
# java = "C:/path/to/java.exe"
# For a server (rcon source), point at its world folder:
# world = "/srv/minecraft/world"

[privacy]
# Hides your coordinates on the page and the map marker. The logout map still
# renders around your position — turn render_on_logout off if that's a concern.
hide_coordinates = false

[cursed]
# The machine reaches into the world. Off until you mean it — these run real
# commands as the server console. Try them on a copy of your world first:
# fire spreads.
#
# `when` is "<metric> <op> <number>". Metrics: cpu_temp, gpu_temp (°C),
# mem_percent, uptime_hours, health (0-20), foodlevel (0-20), xplevel.
# A rule fires when its condition holds, then again every cooldown_seconds
# while it still does. {player} becomes rcon.player.
# Run `agent.py --dry-run` to see live metrics and which rules would fire.
enabled = false

[[cursed.rules]]
name = "gpu on fire"
when = "gpu_temp >= 80"
cooldown_seconds = 120
commands = [
  'execute at {player} run fill ~-2 ~ ~-2 ~2 ~ ~2 minecraft:fire replace minecraft:air',
]

[[cursed.rules]]
name = "cpu storm"
when = "cpu_temp >= 85"
cooldown_seconds = 300
commands = ['weather thunder 120s']

[[cursed.rules]]
name = "out of ram"
when = "mem_percent >= 90"
cooldown_seconds = 60
commands = ['effect give {player} minecraft:slowness 30 1']

[[cursed.rules]]
name = "go to bed"
when = "uptime_hours >= 12"
cooldown_seconds = 1800
commands = [
  'title {player} actionbar "this pc has been up for 12 hours. go to bed."',
  'effect give {player} minecraft:nausea 15',
]
