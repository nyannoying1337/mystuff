name = "mc-status"
main = "worker.js"
compatibility_date = "2026-01-01"

# No custom domain here, so a fork deploys as-is to mc-status.<you>.workers.dev.
# To serve it on your own domain (its DNS must be on Cloudflare), deploy with the
# generated config instead, which adds the route:
#   python setup.py deploy            (from your machine)
#   the "Deploy Worker" workflow      (with the MCS_API_URL repository variable set)

# State lives in a SQLite-backed Durable Object: the free plan allows 100,000
# writes a day (KV would only allow 1,000). Nothing to create by hand.
[[durable_objects.bindings]]
name = "STORE"
class_name = "StatusStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatusStore"]

# Secrets, never committed: PUSH_TOKEN (the agent's) and VIEW_KEY (the invite key).
# setup.py sets both.
