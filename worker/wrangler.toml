name = "mc-status"
main = "worker.js"
compatibility_date = "2026-01-01"

# Served at its own subdomain; Cloudflare creates the DNS record on deploy
# (the domain's DNS has to be on Cloudflare, which nyannoying.de is).
routes = [
  { pattern = "status-api.nyannoying.de", custom_domain = true },
]

# Create the namespace first:
#   npx wrangler kv namespace create STATUS
# then paste the returned id below.
[[kv_namespaces]]
binding = "STATUS"
id = "802ad94f883342dca526bf223c7077e0"

# Set the shared secret (never commit it):
#   npx wrangler secret put PUSH_TOKEN
