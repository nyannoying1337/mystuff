name = "mc-status"
main = "worker.js"
compatibility_date = "2026-01-01"

# Served at its own subdomain; Cloudflare creates the DNS record on deploy
# (the domain's DNS has to be on Cloudflare, which nyannoying.de is).
routes = [
  { pattern = "status-api.nyannoying.de", custom_domain = true },
]

# State lives in a SQLite-backed Durable Object: free plan allows 100,000
# writes a day (KV would only allow 1,000). Nothing to create by hand.
[[durable_objects.bindings]]
name = "STORE"
class_name = "StatusStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatusStore"]

# The push token is a secret, never committed. setup-token.ps1 sets it:
#   npx wrangler secret put PUSH_TOKEN
