name: Release mod

# Push a tag like v1.0.4 and the mod jar is built and attached to a GitHub
# Release, where setup.py (and anyone else) can download it. Workflow artifacts
# expire and need a GitHub login; release assets don't.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build
      - name: Check the tag matches the mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but gradle.properties says $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: mod/build/libs/mc-status-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
