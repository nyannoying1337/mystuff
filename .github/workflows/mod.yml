name: Build mod

on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  pull_request:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: mc-status-mod
          path: mod/build/libs/*.jar
