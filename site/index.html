<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status</title>
<meta name="description" content="Live machine and Minecraft status.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root {
  --panel: #c6c6c6;
  --panel-light: #ffffff;
  --panel-dark: #555555;
  --slot: #8b8b8b;
  --slot-dark: #373737;
  --ink: #3f3f3f;
  --ink-dim: #6d6d6d;
  --void: #1d1d1d;
  --xp: #7fb238;
  --xp-dark: #4e7020;
  --heart: #d63a2f;
  --heart-empty: #4a1512;
  --hunger: #b8762e;
  --hunger-empty: #3d2712;
  --step: 8px;
}

* { box-sizing: border-box; }

html {
  background: #2b2118;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 4px, transparent 4px 8px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px);
}

body {
  margin: 0;
  padding: clamp(12px, 4vw, 40px) clamp(10px, 4vw, 24px);
  font-family: "Press Start 2P", ui-monospace, monospace;
  font-size: 10px;
  line-height: 2;
  color: var(--ink);
  -webkit-font-smoothing: none;
}

img, canvas { image-rendering: pixelated; }

main { max-width: 560px; margin: 0 auto; }

.panel {
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 14px;
  margin-bottom: 14px;
}

.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

h1 { font-size: 14px; margin: 0; font-weight: 400; }

.badge {
  padding: 5px 7px;
  color: #173404;
  background: var(--xp);
  border-top: 2px solid #a5d45e;
  border-left: 2px solid #a5d45e;
  border-right: 2px solid var(--xp-dark);
  border-bottom: 2px solid var(--xp-dark);
}
.badge[data-state="offline"] {
  color: #4b1528;
  background: #a94b4b;
  border-top-color: #cf7676;
  border-left-color: #cf7676;
  border-right-color: #6d2626;
  border-bottom-color: #6d2626;
}

h2 {
  font-size: 10px;
  font-weight: 400;
  color: var(--ink-dim);
  margin: 0 0 8px;
}

.icons { display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 8px; }
.icon { position: relative; width: 18px; height: 18px; }
.icon .half {
  position: absolute;
  inset: 0;
  width: 50%;
  overflow: hidden;
}
.icon svg { position: absolute; inset: 0; width: 18px; height: 18px; }

.xp-track {
  height: 12px;
  background: var(--void);
  border: 2px solid #101010;
  margin-bottom: 4px;
}
.xp-fill { height: 100%; background: var(--xp); width: 0; }
.xp-label { text-align: center; color: var(--xp-dark); margin-bottom: 14px; }

.hotbar {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 2px;
  margin-bottom: 14px;
}
.slot {
  aspect-ratio: 1;
  background: var(--slot);
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
  position: relative;
}
.slot[data-selected="true"] { outline: 3px solid #ffffff; outline-offset: 1px; z-index: 1; }
.item { position: absolute; inset: 4px; }
.item[data-enchanted="true"] { box-shadow: inset 0 0 0 2px rgba(180,120,255,.85); }
.count {
  position: absolute;
  right: 1px;
  bottom: -1px;
  font-size: 8px;
  line-height: 1;
  color: #ffffff;
  text-shadow: 1px 1px 0 #3f3f3f;
}
.durability {
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 2px;
  height: 3px;
  background: #000000;
}
.durability span { display: block; height: 100%; }

.shot {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #000000;
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
}
.caption { color: var(--ink-dim); margin-top: 6px; }

dl { margin: 0; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 2px solid rgba(85,85,85,.25);
  padding: 3px 0;
}
.row:last-child { border-bottom: 0; }
.row dt { color: var(--ink-dim); }
.row dd { margin: 0; text-align: right; word-break: break-word; }

.map-link { display: block; text-align: center; color: var(--ink); }
.map-link:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }

.disconnect { text-align: center; padding: 22px 14px; }
.disconnect p { margin: 0 0 14px; line-height: 2.2; }
.disconnect p:last-child { margin: 0; color: var(--ink-dim); }

button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 10px 16px;
  cursor: pointer;
}
button:hover { background: #d6d6d6; }
button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
button:active {
  border-top-color: var(--panel-dark);
  border-left-color: var(--panel-dark);
  border-right-color: var(--panel-light);
  border-bottom-color: var(--panel-light);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

@media (max-width: 420px) {
  .hotbar { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 9 9">
    <path d="M1 1h3v1h1v-1h3v3h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1z" shape-rendering="crispEdges"/>
  </symbol>
  <symbol id="hunger" viewBox="0 0 9 9">
    <path d="M3 1h3v1h1v3h-1v1h-2v1h-1v1h-2v-1h-1v-2h1v-1h1v-1h1z" shape-rendering="crispEdges"/>
  </symbol>
</svg>

<main>
  <h1 class="sr-only">Live status</h1>
  <div id="root" aria-live="polite">
    <section class="panel disconnect">
      <p>Connecting…</p>
    </section>
  </div>
</main>

<script>
const API = "https://status-api.yourdomain.tld";
const POLL_MS = 15000;
const STALE_MS = 90000;

const ITEM_COLORS = {
  "minecraft:dirt": "#79553a",
  "minecraft:grass_block": "#5d8a3a",
  "minecraft:cobblestone": "#7a7a7a",
  "minecraft:stone": "#8f8f8f",
  "minecraft:deepslate": "#4c4c50",
  "minecraft:oak_planks": "#b8945f",
  "minecraft:oak_log": "#6b4f2a",
  "minecraft:sand": "#dbd3a0",
  "minecraft:diamond": "#4fd6d2",
  "minecraft:diamond_pickaxe": "#4fd6d2",
  "minecraft:diamond_sword": "#4fd6d2",
  "minecraft:netherite_pickaxe": "#4a4247",
  "minecraft:netherite_sword": "#4a4247",
  "minecraft:iron_ingot": "#d8d8d8",
  "minecraft:iron_pickaxe": "#d8d8d8",
  "minecraft:gold_ingot": "#f5d33a",
  "minecraft:redstone": "#c81f1f",
  "minecraft:lapis_lazuli": "#2b52c4",
  "minecraft:emerald": "#17c05a",
  "minecraft:coal": "#2b2b2b",
  "minecraft:torch": "#e8b13a",
  "minecraft:bread": "#c89141",
  "minecraft:cooked_beef": "#8a4b2a",
  "minecraft:golden_apple": "#f5d33a",
  "minecraft:water_bucket": "#3b6fd4",
  "minecraft:ender_pearl": "#1c6b60",
  "minecraft:obsidian": "#241a35",
  "minecraft:tnt": "#c83b32",
};

function colorFor(id) {
  if (ITEM_COLORS[id]) return ITEM_COLORS[id];
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue} 42% 46%)`;
}

function prettyName(id) {
  return id.replace(/^minecraft:/, "").replace(/_/g, " ");
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function iconRow(value, max, symbol, full, empty) {
  const row = el("div", { class: "icons" });
  for (let i = 0; i < max; i++) {
    const filled = value - i * 2;
    const wrap = el("div", { class: "icon" });
    wrap.innerHTML = `<svg viewBox="0 0 9 9" fill="${empty}"><use href="#${symbol}"/></svg>`;
    if (filled >= 2) {
      wrap.innerHTML += `<svg viewBox="0 0 9 9" fill="${full}"><use href="#${symbol}"/></svg>`;
    } else if (filled >= 1) {
      const half = el("div", { class: "half" });
      half.innerHTML = `<svg viewBox="0 0 9 9" fill="${full}"><use href="#${symbol}"/></svg>`;
      wrap.append(half);
    }
    row.append(wrap);
  }
  return row;
}

function slotNode(item, selected) {
  const slot = el("div", { class: "slot" });
  if (selected) slot.dataset.selected = "true";
  if (!item) return slot;

  slot.title = `${prettyName(item.id)} x${item.count}`;
  const block = el("div", { class: "item" });
  block.style.background = colorFor(item.id);
  if (item.enchanted) block.dataset.enchanted = "true";
  slot.append(block);

  if (item.count > 1) slot.append(el("span", { class: "count", text: String(item.count) }));

  if (item.damage && item.max_damage) {
    const left = Math.max(0, 1 - item.damage / item.max_damage);
    const bar = el("div", { class: "durability" });
    const fill = el("span");
    fill.style.width = `${Math.round(left * 100)}%`;
    fill.style.background = `hsl(${Math.round(left * 110)} 90% 45%)`;
    bar.append(fill);
    slot.append(bar);
  }
  return slot;
}

function statRows(pairs) {
  const list = el("dl");
  for (const [label, value] of pairs) {
    if (value === null || value === undefined || value === "") continue;
    list.append(el("div", { class: "row" }, [
      el("dt", { text: label }),
      el("dd", { text: String(value) }),
    ]));
  }
  return list;
}

function disconnectPanel(title, detail) {
  const panel = el("section", { class: "panel disconnect" }, [
    el("p", { text: title }),
    el("p", { text: detail }),
  ]);
  const retry = el("button", { type: "button", text: "Try again" });
  retry.addEventListener("click", () => refresh());
  panel.append(retry);
  return panel;
}

function render(data) {
  const root = document.getElementById("root");
  const frag = document.createDocumentFragment();
  const age = Date.now() - (data.received_at || data.generated_at || 0);
  const stale = age > STALE_MS;

  if (stale) {
    root.replaceChildren(disconnectPanel(
      "Connection lost",
      `Last heard from the machine ${Math.round(age / 60000)} min ago.`
    ));
    return;
  }

  const player = data.player || {};
  const system = data.system || {};

  const status = el("section", { class: "panel" });
  const badge = el("span", { class: "badge", text: player.online ? "in game" : "not playing" });
  badge.dataset.state = player.online ? "online" : "offline";
  status.append(el("div", { class: "head" }, [
    el("h1", { text: player.name || "status" }),
    badge,
  ]));

  if (player.online) {
    status.append(iconRow(player.health ?? 0, 10, "heart", "var(--heart)", "var(--heart-empty)"));
    status.append(iconRow(player.foodlevel ?? 0, 10, "hunger", "var(--hunger)", "var(--hunger-empty)"));

    const track = el("div", { class: "xp-track" });
    const fill = el("div", { class: "xp-fill" });
    fill.style.width = `${Math.round((player.xpp ?? 0) * 100)}%`;
    track.append(fill);
    status.append(track);
    status.append(el("div", { class: "xp-label", text: `lvl ${player.xplevel ?? 0}` }));

    const hotbar = el("div", { class: "hotbar" });
    const bySlot = new Map((player.hotbar || []).map((item) => [item.slot, item]));
    for (let i = 0; i < 9; i++) {
      hotbar.append(slotNode(bySlot.get(i), i === player.selecteditemslot));
    }
    status.append(hotbar);

    const position = player.position
      ? player.position.map((n) => Math.round(n)).join("  ")
      : "hidden";
    status.append(statRows([
      ["x y z", position],
      ["dimension", (player.dimension || "").replace(/^minecraft:/, "")],
    ]));
  } else {
    status.append(el("p", { text: "No world loaded right now." }));
  }
  frag.append(status);

  if (data.screenshot_at) {
    const shot = el("section", { class: "panel" }, [
      el("h2", { text: "Last thing seen" }),
    ]);
    const image = el("img", {
      class: "shot",
      alt: "The most recent in-game screenshot.",
      loading: "lazy",
    });
    image.src = `${API}/shot?t=${data.screenshot_at}`;
    shot.append(image);
    const when = new Date(data.screenshot_at);
    shot.append(el("div", { class: "caption", text: when.toLocaleString() }));
    frag.append(shot);
  }

  if (Object.keys(system).length) {
    const machine = el("section", { class: "panel" }, [el("h2", { text: "The machine" })]);
    machine.append(statRows([
      ["os", system.os],
      ["kernel", system.kernel],
      ["desktop", system.de],
      ["cpu", system.cpu],
      ["cpu temp", system.cpu_temp ? `${Math.round(system.cpu_temp)} c` : null],
      ["gpu", system.gpu],
      ["gpu temp", system.gpu_temp ? `${Math.round(system.gpu_temp)} c` : null],
      ["uptime", system.uptime && system.uptime.uptime
        ? `${Math.floor(system.uptime.uptime / 3600000)}h`
        : null],
    ]));
    frag.append(machine);
  }

  if (Array.isArray(data.curses) && data.curses.length) {
    const curses = el("section", { class: "panel" }, [el("h2", { text: "Recent curses" })]);
    curses.append(statRows(data.curses.map((curse) => [
      curse.name,
      `${CURSE_UNITS[curse.metric] ? Math.round(curse.value) + CURSE_UNITS[curse.metric] : curse.value}`
        + ` · ${timeAgo(curse.at)}`,
    ])));
    frag.append(curses);
  }

  if (mapAvailable) {
    const link = el("a", { class: "map-link", href: "map/", text: "Open the world map" });
    frag.append(el("section", { class: "panel" }, [link]));
  }

  root.replaceChildren(frag);
}

const CURSE_UNITS = { cpu_temp: " c", gpu_temp: " c", mem_percent: "%", uptime_hours: "h" };

function timeAgo(ms) {
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  return `${Math.round(minutes / 60)}h ago`;
}

// The map is rendered separately and may not exist yet; only link it if it does.
let mapAvailable = false;
fetch("map/settings.json", { method: "HEAD" })
  .then((response) => {
    mapAvailable = response.ok;
    if (mapAvailable) refresh();
  })
  .catch(() => {});

async function refresh() {
  try {
    const response = await fetch(`${API}/status`, { cache: "no-store" });
    if (response.status === 404) {
      document.getElementById("root").replaceChildren(
        disconnectPanel("Nothing reported yet", "The agent has not pushed anything.")
      );
      return;
    }
    if (!response.ok) throw new Error(`http ${response.status}`);
    render(await response.json());
  } catch (err) {
    document.getElementById("root").replaceChildren(
      disconnectPanel("Can't reach the server", "Check back in a moment.")
    );
  }
}

refresh();
setInterval(() => {
  if (!document.hidden) refresh();
}, POLL_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});
</script>
</body>
</html>
