<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nyannoying · live</title>
<meta name="description" content="Live Minecraft status, invite only.">
<meta name="theme-color" content="#1e1e1f">
<link rel="icon" href="assets/mc/item/grass_block.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap">
<style>
/* Ore UI — the look of Minecraft's current in-game menus: charcoal panels with
   a dark outline, a light top edge and a heavier bottom lip; chunky buttons
   that press down. Game textures only where the game would show them. */
:root {
  --page: #1e1e1f;
  --deep: #141415;
  --panel: #313233;
  --panel-raised: #3c3d3e;
  --tile: #48494a;
  --edge: #0e0e0f;
  --lip: #232324;
  --highlight: #4c4d4f;
  --divider: #434446;
  --text: #ffffff;
  --text-2: #c7c8cb;
  --text-3: #8f9094;
  --green: #3c8527;
  --green-hover: #347523;
  --green-lip: #1d4d13;
  --green-top: #58a53c;
  --stone: #d0d1d4;
  --stone-hover: #e0e1e4;
  --stone-lip: #58585a;
  --stone-top: #ecedee;
  --gold: #ffd84a;
  --radius: 4px;
  font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { min-height: 100vh; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5; }
img { image-rendering: pixelated; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { width: min(1120px, 100% - 32px); margin: 0 auto; }

/* ---- chrome ---- */
.topbar { border-bottom: 2px solid var(--edge); background: var(--deep); position: sticky; top: 0; z-index: 5; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; }
.brand img { width: calc(16 * var(--t2, 2px)); height: calc(16 * var(--t2, 2px)); }
.brand span { font-weight: 800; font-size: 18px; letter-spacing: .2px; }
.top-actions { display: flex; align-items: center; gap: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--edge);
  font-size: 13px; font-weight: 700; color: var(--text-2); white-space: nowrap;
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.pill[data-state="online"] { color: #d6f5c8; }
.pill[data-state="online"]::before { background: #6cd04a; box-shadow: 0 0 0 3px rgba(108, 208, 74, .25); }
.pill[data-state="server"] { color: #cfe0ff; }
.pill[data-state="server"]::before { background: #6ea4ff; }
.pill[data-state="quiet"]::before { background: var(--gold); }

main { flex: 1; padding: 28px 0 40px; }

.panel {
  background: var(--panel);
  border: 2px solid var(--edge);
  border-radius: var(--radius);
  box-shadow: inset 0 2px 0 var(--highlight), inset 0 -4px 0 var(--lip);
  padding: 18px 20px 22px;
}
.panel h2 {
  margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; color: var(--text-3);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 20px 13px; border: 2px solid var(--edge); border-radius: var(--radius);
  font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer;
  transition: transform .06s ease;
}
.btn:active { transform: translateY(2px); }
.btn-green {
  color: #fff; background: var(--green);
  box-shadow: inset 0 2px 0 var(--green-top), inset 0 -4px 0 var(--green-lip);
}
.btn-green:hover { background: var(--green-hover); }
.btn-green:active { box-shadow: inset 0 2px 0 var(--green-top), inset 0 -2px 0 var(--green-lip); }
.btn-stone {
  color: #1e1e1f; background: var(--stone);
  box-shadow: inset 0 2px 0 var(--stone-top), inset 0 -4px 0 var(--stone-lip);
}
.btn-stone:hover { background: var(--stone-hover); }
.btn-stone:active { box-shadow: inset 0 2px 0 var(--stone-top), inset 0 -2px 0 var(--stone-lip); }
.btn-small { padding: 5px 14px 9px; font-size: 13px; white-space: nowrap; }
@media (max-width: 520px) {
  #map-button { display: none; }  /* the map card below has the same button */
  .brand span { font-size: 16px; }
}
.btn[hidden] { display: none; }

.link-button { background: none; border: 0; padding: 0; color: var(--text-3); text-decoration: underline; cursor: pointer; }
.link-button:hover { color: var(--text-2); }

/* ---- hero: your latest frame, then who you are and how you are doing ---- */
.hero { padding: 0; overflow: hidden; }
.scene {
  position: relative; aspect-ratio: 16 / 7; min-height: 260px;
  background: var(--deep) center / cover no-repeat;
  border-bottom: 2px solid var(--edge);
}
.scene::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(20, 20, 21, .15) 0%, rgba(20, 20, 21, 0) 40%, rgba(20, 20, 21, .85) 100%);
}
.scene[data-offline="true"] { filter: grayscale(.7) brightness(.75); }
.scene-chip {
  position: absolute; top: 14px; left: 14px; z-index: 1;
  padding: 4px 10px; border-radius: var(--radius);
  background: rgba(14, 14, 15, .75); color: var(--text-2); font-size: 12px; font-weight: 500;
}
.scene-note {
  position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; gap: 4px;
}
.scene-note strong { font-size: 28px; font-weight: 800; }
.scene-note span { color: var(--text-2); }

/* hearts, hunger and XP sit where the game draws them: bottom centre of the frame */
.vitals-dock { position: absolute; left: 0; right: 0; bottom: 6%; z-index: 1; display: flex; justify-content: center; pointer-events: none; }
.vitals-dock .gui { margin: 0; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .45)); }
/* a fresh advancement pops in top right, like the game's toast */
.toast-dock { position: absolute; top: 12px; left: 0; right: 12px; z-index: 2; display: flex; justify-content: flex-end; pointer-events: none; }
.toast-dock .gui { margin: 0; filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .5)); }
.toast-dock .gui[data-enter="true"] { animation: toast-in .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes toast-in { from { transform: translateX(calc(100% + 16px)); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast-dock .gui[data-enter="true"] { animation: none; } }

/* play time per day */
.pt-chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; }
.pt-day { display: grid; grid-template-rows: 18px 120px 20px; gap: 4px; text-align: center; min-width: 0; }
.pt-value { font-size: 11px; font-weight: 700; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pt-track { position: relative; background: var(--deep); border: 2px solid var(--edge); border-radius: 3px; overflow: hidden; }
.pt-track i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--green); box-shadow: inset 0 2px 0 var(--green-top), inset 0 -3px 0 var(--green-lip); }
.pt-label { font-size: 12px; color: var(--text-3); }
.pt-day[data-today="true"] .pt-label { color: var(--gold); font-weight: 700; }
.pt-day[data-today="true"] .pt-track i { background: #c7901a; box-shadow: inset 0 2px 0 #e7b441, inset 0 -3px 0 #7a5409; }

.identity { display: flex; align-items: center; gap: 18px 24px; padding: 18px 22px 22px; flex-wrap: wrap; }
.avatar {
  width: 72px; height: 72px; flex: none; border: 2px solid var(--edge); border-radius: var(--radius);
  background: var(--tile); box-shadow: inset 0 2px 0 #5d5e60; display: grid; place-items: center; overflow: hidden;
}
.avatar img { width: 64px; height: 64px; }
.who { flex: 1; min-width: 200px; }
.who h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.15; word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--radius);
  background: var(--panel-raised); border: 2px solid var(--edge);
  font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums;
}
.chip b { color: var(--text); font-weight: 700; }

/* ---- dashboard grid ---- */
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
.col { display: grid; gap: 20px; }
@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .scene { aspect-ratio: 16 / 10; min-height: 0; }
}

.inventory-well { background: var(--deep); border: 2px solid var(--edge); border-radius: var(--radius); padding: clamp(6px, 1.5vw, 12px); }

dl { margin: 0; }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--divider); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row:first-child { padding-top: 0; }
.row dt { color: var(--text-3); }
.row dd { margin: 0; text-align: right; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; word-break: break-word; }

.stats-panel { margin-top: 20px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head h2 { margin: 0; }
.panel-head small { color: var(--text-3); font-size: 12px; }
.subhead { margin: 18px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); }

/* icon + number tiles (world, statistics) */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
.tiles-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* an odd one out spans the row instead of leaving a hole */
.tiles-2 > :last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (max-width: 420px) { .tiles-2 { grid-template-columns: minmax(0, 1fr); } }
.tile {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  padding: 9px 12px 11px; border: 2px solid var(--edge); border-radius: var(--radius);
  background: var(--panel-raised); box-shadow: inset 0 2px 0 #505153, inset 0 -3px 0 #2a2b2c;
}
.tile > img { width: calc(16 * var(--t2, 2px)); height: calc(16 * var(--t2, 2px)); flex: none; }
.tile div { min-width: 0; }
.tile .k { display: block; font-size: 12px; font-weight: 700; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { display: block; font-size: 17px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* load bars (machine, advancement progress) */
.meter + .meter { margin-top: 14px; }
.meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.meter-head span { font-weight: 700; }
.meter-head b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter-note { display: block; margin-top: 4px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 14px; background: var(--deep); border: 2px solid var(--edge); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); box-shadow: inset 0 2px 0 var(--green-top), inset 0 -3px 0 var(--green-lip); transition: width .4s ease; }
.bar[data-level="warm"] i { background: #c7901a; box-shadow: inset 0 2px 0 #e7b441, inset 0 -3px 0 #7a5409; }
.bar[data-level="hot"] i { background: #c0392b; box-shadow: inset 0 2px 0 #e0625a, inset 0 -3px 0 #6d1a12; }
.bar-thin { height: 10px; }
.machine-rows { margin-top: 18px; }

/* advancements */
.adv-total { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.adv-total strong { font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.adv-total span { color: var(--text-2); }
.adv-tabs { display: grid; gap: 8px; margin-top: 16px; }
.adv-tab { display: grid; grid-template-columns: calc(16 * var(--t1, 1.25px)) minmax(78px, auto) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; }
.adv-tab img { width: calc(16 * var(--t1, 1.25px)); height: calc(16 * var(--t1, 1.25px)); }
.adv-tab b { font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; }
.adv-list { display: grid; gap: 8px; }
.adv { display: flex; align-items: center; gap: 12px; min-width: 0; }
.adv-frame { position: relative; width: calc(26 * var(--t2, 2px)); height: calc(26 * var(--t2, 2px)); flex: none; }
.adv-frame > img { position: absolute; image-rendering: pixelated; }
.adv-frame .frame { inset: 0; width: 100%; height: 100%; }
.adv-frame .icon { left: calc(5 * var(--t2, 2px)); top: calc(5 * var(--t2, 2px)); width: calc(16 * var(--t2, 2px)); height: calc(16 * var(--t2, 2px)); }
.adv-body { min-width: 0; flex: 1; }
.adv-title { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv-title[data-type="challenge"] { color: #e7a8ff; }
.adv-desc { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv-when { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.adv-body .bar { margin-top: 5px; }

.map-card p { margin: 0 0 16px; color: var(--text-2); }
.map-card .btn { width: 100%; }

.empty { color: var(--text-2); margin: 0; }

/* ---- centered screens: join, notices ---- */
.center { min-height: calc(100vh - 64px - 120px); display: grid; place-items: center; padding: 20px 0; }
.card-narrow { width: min(440px, 100%); text-align: center; padding: 30px 28px 32px; }
.card-narrow .big-icon { width: calc(16 * var(--t4, 4px)); height: calc(16 * var(--t4, 4px)); margin: 0 auto 14px; display: block; }
.card-narrow h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
.card-narrow p { margin: 0 0 20px; color: var(--text-2); }
.card-narrow .btn { width: 100%; }

.field { text-align: left; margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
.field input {
  width: 100%; height: 46px; padding: 0 14px; color: var(--text);
  background: var(--deep); border: 2px solid var(--edge); border-radius: var(--radius);
  box-shadow: inset 0 2px 0 #0a0a0b; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 15px;
}
.field input::placeholder { color: #5f6064; }
.field input:focus { border-color: var(--gold); outline: none; }
.field input[aria-invalid="true"] { border-color: #e0524a; }
.error { color: #ff8d86; font-size: 13px; margin: 8px 0 0; min-height: 0; }
.hint { color: var(--text-3); font-size: 13px; margin-top: 16px !important; margin-bottom: 0 !important; }

/* ---- game GUIs, laid out in native GUI pixels and scaled as one ---- */
.gui { position: relative; margin: 0 auto; }
.gui > * { position: absolute; display: block; }
.preview-body { object-fit: contain; image-rendering: auto; }
.slot-hit { padding: 0; border: 0; background: transparent; cursor: help; }
.slot-hit:hover { background: rgba(255, 255, 255, .45); }
.slot-hit:focus-visible { outline: 2px solid #fff; outline-offset: 0; }
.swatch { outline: 1px solid rgba(0, 0, 0, .35); outline-offset: -1px; }
.glint {
  mask-size: 100% 100%; -webkit-mask-size: 100% 100%;
  background-image: url("assets/mc/glint.png"); background-size: 400% 400%;
  mix-blend-mode: screen; opacity: .7; animation: glint 7s linear infinite; pointer-events: none;
}
@keyframes glint { from { background-position: 0% 0%; } to { background-position: 100% 133%; } }
@media (prefers-reduced-motion: reduce) { .glint { animation: none; } .btn { transition: none; } }

/* the item tooltip keeps the game's own look */
.tooltip {
  position: fixed; z-index: 20; max-width: min(320px, calc(100vw - 16px));
  padding: 6px 10px; font-size: 13px; line-height: 1.5; color: #fff;
  background: rgba(16, 0, 16, .95); border: 2px solid #28007f; outline: 2px solid rgba(16, 0, 16, .95);
  box-shadow: inset 0 0 0 1px #5000ff; pointer-events: none; text-shadow: 1px 1px 0 #3f3f3f;
}
.tooltip .title[data-enchanted="true"] { color: #55ffff; }
.tooltip .custom { font-style: italic; }
.tooltip .line { color: #aaaaaa; }

footer { border-top: 2px solid var(--edge); background: var(--deep); }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding: 16px 0; font-size: 12px; color: var(--text-3); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/mc/item/grass_block.png" alt=""><span>nyannoying</span></a>
    <div class="top-actions">
      <span class="pill" id="live-pill" hidden></span>
      <a class="btn btn-stone btn-small" id="map-button" href="map/" hidden>World map</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="root" aria-live="polite">
    <div class="center"><p class="empty">Connecting…</p></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>NOT AN OFFICIAL MINECRAFT WEBSITE. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.</span>
    <button type="button" class="link-button" id="forget-key" hidden>Forget key on this device</button>
  </div>
</footer>

<script>
const API = "https://status-api.nyannoying.de";
const STALE_MS = 90000;
const MAX_VIEWERS = 10;          // must match the Worker
const FALLBACK_POLL_MS = 60000;  // only if WebSockets keep failing
const HIDDEN_GRACE_MS = 60000;   // a background tab gives its viewer slot back after this

// Built at deploy time by site/build_assets.py from the Minecraft client jar.
const ASSETS = "assets/mc";

// Glyph widths for the game font and English names; false when the assets
// weren't built, in which case the page falls back to plain text.
let glyphWidths = null;
let names = { items: {}, enchantments: {}, levels: {} };
const assetsReady = Promise.all([
  fetch(`${ASSETS}/font/widths.json`).then((r) => (r.ok ? r.json() : false)).catch(() => false),
  fetch(`${ASSETS}/names.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
]).then(([widths, loadedNames]) => {
  glyphWidths = widths;
  if (loadedNames) names = loadedNames;
});

function colorFor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360} 42% 46%)`;
}

function itemName(item) {
  const short = item.id.replace(/^minecraft:/, "");
  return names.items[short] || short.replace(/_/g, " ");
}

// Enchantments that only have one level; the game shows them without "I".
const SINGLE_LEVEL = new Set([
  "mending", "silk_touch", "infinity", "flame", "channeling", "multishot",
  "aqua_affinity", "binding_curse", "vanishing_curse",
]);

function enchantmentName(enchantment) {
  const short = enchantment.id.replace(/^minecraft:/, "");
  const name = names.enchantments[short] || short.replace(/_/g, " ");
  if (SINGLE_LEVEL.has(short) && enchantment.level === 1) return name;
  return `${name} ${names.levels[String(enchantment.level)] || enchantment.level}`;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

// ---- game GUI drawing --------------------------------------------------------

// A box measured in GUI pixels; children are placed by percentage so the whole
// thing scales as one image would. fitGuis() gives it a whole number of screen
// pixels per GUI pixel. `fill` is the share of its container it aims for, `min`
// a width in CSS px it tries to reach, `max` the largest CSS px per GUI pixel.
function makeGui(width, height, className, { fill = 1, min = 0, max = 3 } = {}) {
  const node = el("div", { class: `gui ${className}` });
  node.style.aspectRatio = `${width} / ${height}`;
  Object.assign(node.dataset, { native: width, fill, min, max });
  return {
    node,
    add(child, x, y, w, h) {
      child.style.left = `${(x / width) * 100}%`;
      child.style.top = `${(y / height) * 100}%`;
      child.style.width = `${(w / width) * 100}%`;
      child.style.height = `${(h / height) * 100}%`;
      node.append(child);
      return child;
    },
  };
}

function sprite(gui, name, x, y, w, h) {
  return gui.add(el("img", { src: `${ASSETS}/hud/${name}.png`, alt: "" }), x, y, w, h);
}

function fill(gui, x, y, w, h, color) {
  const node = gui.add(el("div"), x, y, w, h);
  node.style.background = color;
  return node;
}

function masked(node, url) {
  node.style.maskImage = `url("${url}")`;
  node.style.webkitMaskImage = `url("${url}")`;
  return node;
}

function textWidth(text) {
  let width = 0;
  for (const char of text) width += (glyphWidths[char] ?? 5) + 1;
  return width;
}

// color: one of the pre-tinted glyph sets from build_assets.py (white, shadow, green, black)
function drawText(gui, text, x, y, color) {
  let cursor = x;
  for (const char of text) {
    const width = glyphWidths[char];
    if (width === undefined) { cursor += 6; continue; }
    gui.add(el("img", { src: `${ASSETS}/font/${color}/${char.charCodeAt(0)}.png`, alt: "" }), cursor, y, width, 8);
    cursor += width + 1;
  }
}

function drawShadowText(gui, text, x, y) {
  drawText(gui, text, x + 1, y + 1, "shadow");
  drawText(gui, text, x, y, "white");
}

// Pixel art only stays sharp when each texture pixel covers a whole number of
// screen pixels. With Windows display scaling (125 %, 150 %) "2×" in CSS isn't,
// so sizes are rounded to the screen: --t1/--t2/--t4 are one texture pixel at
// roughly 1.25, 2 and 4 CSS px, and GUIs get an integer scale.
function fitPixels() {
  const dpr = window.devicePixelRatio || 1;
  const rootStyle = document.documentElement.style;
  for (const [name, scale] of [["--t1", 1.25], ["--t2", 2], ["--t4", 4]]) {
    rootStyle.setProperty(name, `${Math.max(1, Math.round(scale * dpr)) / dpr}px`);
  }
  for (const gui of document.querySelectorAll(".gui[data-native]")) {
    const parent = gui.parentElement;
    const style = getComputedStyle(parent);
    const box = parent.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    if (box <= 0) continue;
    const native = Number(gui.dataset.native);
    const target = Math.min(box, Math.max(box * Number(gui.dataset.fill), Number(gui.dataset.min)));
    // nearest whole scale to the target, but never wider than the box or the max
    const fits = Math.floor((box * dpr) / native);
    const wanted = Math.round((target * dpr) / native);
    const scale = Math.max(1, Math.min(wanted, fits, Math.round(Number(gui.dataset.max) * dpr)));
    gui.style.width = `${(scale * native) / dpr}px`;
  }
}

let fitQueued = false;
window.addEventListener("resize", () => {  // also fires on browser zoom, which changes the pixel ratio
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitPixels(); });
});

// One item at slot position (x, y), drawn like the game: icon, glint, count,
// durability bar, plus an invisible button that shows the tooltip.
function drawItem(gui, item, x, y, key) {
  const short = item.id.startsWith("minecraft:") ? item.id.slice(10) : null;
  const url = `${ASSETS}/item/${short}.png`;

  const swatch = () => {
    const node = el("div", { class: "swatch" });
    node.style.background = colorFor(item.id);
    return node;
  };

  if (short) {
    const icon = gui.add(el("img", { src: url, alt: "" }), x, y, 16, 16);
    // banners, shields, modded items…: no rendered icon, show a colour swatch
    icon.addEventListener("error", () => icon.replaceWith(gui.add(swatch(), x + 2, y + 2, 12, 12)), { once: true });
    if (item.enchanted) masked(gui.add(el("div", { class: "glint" }), x, y, 16, 16), url);
  } else {
    gui.add(swatch(), x + 2, y + 2, 12, 12);
  }

  if (item.count > 1) {
    const text = String(item.count);
    drawShadowText(gui, text, x + 19 - 2 - textWidth(text), y + 9);
  }

  if (item.damage && item.max_damage) {
    const left = Math.max(0, (item.max_damage - item.damage) / item.max_damage);
    const width = Math.round(13 - (item.damage * 13) / item.max_damage);
    fill(gui, x + 2, y + 13, 13, 2, "#000000");
    fill(gui, x + 2, y + 13, Math.max(0, width), 1, `hsl(${Math.round(left * 120)} 100% 50%)`);
  }

  const hit = gui.add(el("button", {
    type: "button",
    class: "slot-hit",
    "aria-label": tooltipLines(item).map((line) => line.text).join(", "),
    "data-key": key,
  }), x, y, 16, 16);
  bindTooltip(hit, item);
}

// ---- tooltips ------------------------------------------------------------------

const tooltip = el("div", { class: "tooltip", role: "tooltip", hidden: "" });
document.body.append(tooltip);
let tooltipKey = null;
let tooltipPinned = false;

function tooltipLines(item) {
  const lines = [item.name
    ? { text: item.name, cls: "title custom" }
    : { text: itemName(item), cls: "title" }];
  for (const enchantment of item.enchantments || []) lines.push({ text: enchantmentName(enchantment), cls: "line" });
  if (item.max_damage) {
    lines.push({ text: `Durability: ${item.max_damage - (item.damage || 0)} / ${item.max_damage}`, cls: "line" });
  }
  return lines;
}

function showTooltip(item, key, anchor) {
  tooltip.replaceChildren(...tooltipLines(item).map((line) => {
    const row = el("div", { class: line.cls, text: line.text });
    if (line.cls.includes("title") && item.enchanted) row.dataset.enchanted = "true";
    return row;
  }));
  tooltip.hidden = false;
  tooltipKey = key;
  if (anchor) {
    const rect = anchor.getBoundingClientRect();
    moveTooltip(rect.right + 6, rect.top - 4);
  }
}

function moveTooltip(x, y) {
  const width = tooltip.offsetWidth;
  const height = tooltip.offsetHeight;
  const left = Math.min(x, window.innerWidth - width - 8);
  const top = Math.min(Math.max(8, y), window.innerHeight - height - 8);
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${top}px`;
}

function hideTooltip() {
  tooltip.hidden = true;
  tooltipKey = null;
  tooltipPinned = false;
}

function bindTooltip(button, item) {
  const key = button.dataset.key;
  button.addEventListener("pointerenter", (event) => {
    if (event.pointerType !== "mouse") return;
    showTooltip(item, key, null);
    moveTooltip(event.clientX + 12, event.clientY - 16);
  });
  button.addEventListener("pointermove", (event) => {
    if (event.pointerType === "mouse" && tooltipKey === key && !tooltipPinned) {
      moveTooltip(event.clientX + 12, event.clientY - 16);
    }
  });
  button.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse" && !tooltipPinned) hideTooltip();
  });
  button.addEventListener("focus", () => showTooltip(item, key, button));
  button.addEventListener("blur", () => { if (!tooltipPinned) hideTooltip(); });
  // taps: pin it until the next tap elsewhere
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    if (tooltipPinned && tooltipKey === key) { hideTooltip(); return; }
    showTooltip(item, key, button);
    tooltipPinned = true;
  });
}

document.addEventListener("click", () => { if (tooltipPinned) hideTooltip(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideTooltip(); });

// ---- HUD and inventory ---------------------------------------------------------

// Armor, hearts, hunger and XP exactly as the game stacks them above the hotbar.
// The hotbar itself isn't repeated: the inventory card already has it.
function vitalsNode(player) {
  const health = Math.ceil(player.health ?? 0);
  const food = player.foodlevel ?? 0;
  const level = player.xplevel ?? 0;
  const armor = player.world?.armor ?? 0;
  const top = armor > 0 ? 10 : 0;
  // about as big relative to the frame as the game draws it at GUI scale 3
  const gui = makeGui(182, top + 15, "vitals", { fill: 0.3, min: 280, max: 3 });
  gui.node.setAttribute("role", "img");
  gui.node.setAttribute("aria-label", [
    `${health / 2} of 10 hearts`, `hunger ${food / 2} of 10`, `level ${level}`,
    armor > 0 ? `armor ${armor / 2} of 10` : null,
  ].filter(Boolean).join(", "));

  const row = (y, count, value, empty, half, full, fromRight) => {
    for (let i = 0; i < 10; i++) {
      const x = fromRight ? 182 - i * 8 - 9 : i * 8;
      sprite(gui, empty, x, y, 9, 9);
      if (i * 2 + 1 < value) sprite(gui, full, x, y, 9, 9);
      else if (i * 2 + 1 === value) sprite(gui, half, x, y, 9, 9);
    }
  };
  if (armor > 0) row(0, 10, armor, "armor_empty", "armor_half", "armor_full", false);
  row(top, 10, health, "heart_container", "heart_half", "heart_full", false);
  row(top, 10, food, "food_empty", "food_half", "food_full", true);

  sprite(gui, "xp_background", 0, top + 10, 182, 5);
  const progress = Math.min(182, Math.floor((player.xpp ?? 0) * 183));
  if (progress > 0) {
    const clip = gui.add(el("div"), 0, top + 10, progress, 5);
    clip.style.overflow = "hidden";
    const bar = el("img", { src: `${ASSETS}/hud/xp_progress.png`, alt: "" });
    bar.style.cssText = `position:absolute;left:0;top:0;height:100%;width:${(182 / progress) * 100}%`;
    clip.append(bar);
  }
  if (level > 0) {
    const text = String(level);
    const x = Math.floor((182 - textWidth(text)) / 2);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) drawText(gui, text, x + dx, top + 4 + dy, "black");
    drawText(gui, text, x, top + 4, "green");
  }
  return gui.node;
}

// The game's advancement toast: shown for a few minutes after earning one.
const TOAST_MS = 5 * 60 * 1000;
const TOAST_TITLES = {
  task: ["Advancement Made!", "yellow"],
  goal: ["Goal Reached!", "yellow"],
  challenge: ["Challenge Complete!", "purple"],
};
const toastsShown = new Set();  // slide in once, not on every re-render

function fitText(text, max) {
  if (textWidth(text) <= max) return text;
  let cut = text;
  while (cut && textWidth(`${cut}...`) > max) cut = cut.slice(0, -1);
  return `${cut.trimEnd()}...`;
}

function toastNode(adv) {
  // same size relative to the frame as the vitals (182 wide at fill .3)
  const gui = makeGui(160, 32, "toast", { fill: 0.3 * 160 / 182, min: 280 * 160 / 182, max: 3 });
  const [heading, color] = TOAST_TITLES[adv.type] || TOAST_TITLES.task;
  gui.node.setAttribute("role", "status");
  gui.node.setAttribute("aria-label", `${heading} ${adv.title}`);
  if (!toastsShown.has(adv.id)) {
    gui.node.dataset.enter = "true";
    toastsShown.add(adv.id);
  }
  sprite(gui, "toast_advancement", 0, 0, 160, 32);
  const url = `${ASSETS}/item/${shortId(adv.icon)}.png`;
  gui.add(el("img", { src: url, alt: "" }), 8, 8, 16, 16);
  if (adv.glint) masked(gui.add(el("div", { class: "glint" }), 8, 8, 16, 16), url);
  drawText(gui, heading, 30, 7, color);
  drawText(gui, fitText(adv.title || "", 125), 30, 18, "white");
  return gui.node;
}

const ARMOR_SLOTS = [["head", "slot_helmet"], ["chest", "slot_chestplate"], ["legs", "slot_leggings"], ["feet", "slot_boots"]];

// The survival inventory screen, slots where the game puts them.
function inventoryNode(player) {
  const gui = makeGui(176, 166, "inventory");
  gui.node.setAttribute("role", "group");
  gui.node.setAttribute("aria-label", "Inventory");
  sprite(gui, "inventory", 0, 0, 176, 166);

  // your character in the dark preview box, like the game shows it
  if (player.name) {
    const body = gui.add(el("img", {
      class: "preview-body", alt: "",
      src: `https://mc-heads.net/body/${encodeURIComponent(player.name)}/right`,
    }), 26, 10, 49, 66);
    body.addEventListener("error", () => body.remove(), { once: true });
  }

  const armor = player.armor || {};
  ARMOR_SLOTS.forEach(([slot, empty], i) => {
    const y = 8 + i * 18;
    if (armor[slot]) drawItem(gui, armor[slot], 8, y, `armor-${slot}`);
    else sprite(gui, empty, 8, y, 16, 16);
  });
  if (player.offhand) drawItem(gui, player.offhand, 77, 62, "offhand");
  else sprite(gui, "slot_shield", 77, 62, 16, 16);

  for (const item of player.inventory || []) {
    const index = item.slot - 9;
    if (index < 0 || index >= 27) continue;
    drawItem(gui, item, 8 + (index % 9) * 18, 84 + Math.floor(index / 9) * 18, `inv-${item.slot}`);
  }
  for (const item of player.hotbar || []) {
    drawItem(gui, item, 8 + item.slot * 18, 142, `bar-${item.slot}`);
  }
  return gui.node;
}

function hasInventory(player) {
  return Boolean((player.hotbar || []).length || (player.inventory || []).length
    || Object.keys(player.armor || {}).length || player.offhand);
}

// Used when the icon assets weren't built: the same facts, as text.
function plainStats(player) {
  const list = (items) => (items || []).map((item) => `${itemName(item)} ×${item.count}`).join(", ") || "empty";
  return statRows([
    ["Health", `${Math.ceil(player.health ?? 0)} / 20`],
    ["Food", `${player.foodlevel ?? 0} / 20`],
    ["Level", player.xplevel ?? 0],
    ["Hotbar", list(player.hotbar)],
    ["Inventory", list(player.inventory)],
  ]);
}

// ---- building blocks -------------------------------------------------------------

function statRows(pairs) {
  const list = el("dl");
  for (const [label, value] of pairs) {
    if (value === null || value === undefined || value === "") continue;
    list.append(el("div", { class: "row" }, [el("dt", { text: label }), el("dd", { text: String(value) })]));
  }
  return list;
}

function panel(title, children, extraClass = "") {
  return el("section", { class: `panel ${extraClass}`.trim() }, [el("h2", { text: title }), ...children]);
}

function chip(label, value) {
  const node = el("span", { class: "chip" });
  if (label) node.append(label, " ");
  node.append(el("b", { text: value }));
  return node;
}

function itemIcon(name, className = "big-icon") {
  return el("img", { class: className, src: `${ASSETS}/item/${name}.png`, alt: "" });
}

function tile(icon, label, value, sub) {
  const img = itemIcon(icon, "");
  img.addEventListener("error", () => { img.src = `${ASSETS}/item/barrier.png`; }, { once: true });
  const body = el("div", {}, [el("span", { class: "k", text: label }), el("span", { class: "v", text: String(value) })]);
  if (sub) body.append(el("span", { class: "s", text: sub }));
  return el("div", { class: "tile" }, [img, body]);
}

function bar(fraction, { thin = false, heat = false } = {}) {
  const pct = Math.max(0, Math.min(1, fraction || 0)) * 100;
  const node = el("div", { class: `bar${thin ? " bar-thin" : ""}`, role: "presentation" });
  if (heat) node.dataset.level = pct >= 85 ? "hot" : pct >= 65 ? "warm" : "ok";
  const fill = el("i");
  fill.style.width = `${pct}%`;
  node.append(fill);
  return node;
}

function meter(label, valueText, fraction, note, heat = true) {
  const node = el("div", { class: "meter" }, [
    el("div", { class: "meter-head" }, [el("span", { text: label }), el("b", { text: valueText })]),
    bar(fraction, { heat }),
  ]);
  if (note) node.append(el("span", { class: "meter-note", text: note }));
  return node;
}

const numberFormat = new Intl.NumberFormat("en-US");
const compactFormat = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
const count = (n) => (n >= 100000 ? compactFormat.format(n) : numberFormat.format(n ?? 0));
const gib = (bytes) => `${(bytes / 2 ** 30).toFixed(bytes >= 10 * 2 ** 30 ? 0 : 1)} GB`;

function duration(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${m} min`;
  return `${m} min`;
}

function distance(cm) {
  const m = (cm || 0) / 100;
  return m >= 1000 ? `${(m / 1000).toFixed(m >= 100000 ? 0 : 1)} km` : `${Math.round(m)} m`;
}

const shortId = (id) => (id || "").replace(/^minecraft:/, "");
const titleCase = (text) => text.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const biomeName = (id) => names.biomes?.[shortId(id)] || titleCase(shortId(id));
const entityName = (id) => names.entities?.[shortId(id)] || titleCase(shortId(id));

// 0 = 6:00 in the game's day
function clockTime(ticks) {
  const minutes = Math.floor((((ticks + 6000) % 24000) / 1000) * 60);
  return `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
}

function worldPanel(world) {
  const t = world.time ?? 0;
  const night = t >= 13000 && t < 23000;
  const weather = { clear: ["sunflower", "Clear"], rain: ["water_bucket", "Rain"], thunder: ["lightning_rod", "Thunderstorm"] }[world.weather]
    || ["sunflower", titleCase(world.weather || "clear")];
  const mode = { survival: "iron_sword", creative: "grass_block", adventure: "map", spectator: "ender_eye" }[world.game_mode] || "iron_sword";
  const tiles = el("div", { class: "tiles tiles-2" }, [
    tile("clock", `Day ${count(world.day ?? 0)}`, clockTime(t), night ? "Night" : "Day"),
    tile(weather[0], "Weather", weather[1]),
    world.biome ? tile("filled_map", "Biome", biomeName(world.biome)) : null,
    tile(world.hardcore ? "wither_rose" : "totem_of_undying", "Difficulty", world.hardcore ? "Hardcore" : titleCase(world.difficulty || "normal")),
    world.game_mode ? tile(mode, "Game mode", titleCase(world.game_mode)) : null,
  ].filter(Boolean));
  return el("section", { class: "panel" }, [
    el("div", { class: "panel-head" }, [el("h2", { text: "World" }), world.name ? el("small", { text: world.name }) : ""]),
    tiles,
  ]);
}

function machinePanel(system, game, online) {
  const parts = [];
  if (typeof system.cpu_percent === "number") {
    parts.push(meter("CPU", `${Math.round(system.cpu_percent)}%`, system.cpu_percent / 100,
      [system.cpu, system.cpu_cores ? `${system.cpu_cores} threads` : null].filter(Boolean).join(" · ")));
  }
  if (typeof system.gpu_percent === "number") {
    parts.push(meter("GPU", `${Math.round(system.gpu_percent)}%`, system.gpu_percent / 100, system.gpu));
  }
  if (system.mem_used && system.mem_total) {
    parts.push(meter("Memory", `${gib(system.mem_used)} / ${gib(system.mem_total)}`, system.mem_used / system.mem_total));
  }
  if (system.vram_used && system.vram_total) {
    parts.push(meter("Video memory", `${gib(system.vram_used)} / ${gib(system.vram_total)}`, system.vram_used / system.vram_total));
  }
  const rows = [
    ["FPS", online && game?.fps ? String(game.fps) : null],
    ["Tick time", online && typeof game?.mspt === "number" ? `${game.mspt} ms` : null],
    ["Game memory", online && game?.mem_max_mb ? `${numberFormat.format(game.mem_used_mb)} / ${numberFormat.format(game.mem_max_mb)} MB` : null],
    ["CPU temp", system.cpu_temp ? `${Math.round(system.cpu_temp)} °C` : null],
    ["GPU temp", system.gpu_temp ? `${Math.round(system.gpu_temp)} °C` : null],
    ["OS", system.os],
    ["Up for", system.uptime?.uptime ? duration(system.uptime.uptime / 1000) : null],
  ];
  // when there are no live numbers, still name the hardware
  if (!parts.length) rows.unshift(["CPU", system.cpu], ["GPU", system.gpu]);
  const list = statRows(rows);
  if (parts.length) list.classList.add("machine-rows");
  return panel("The machine", [...parts, list]);
}

const ADV_TABS = {
  story: ["grass_block", "Minecraft"], nether: ["red_nether_bricks", "Nether"], end: ["end_stone", "The End"],
  adventure: ["map", "Adventure"], husbandry: ["hay_block", "Husbandry"],
};

function advancementRow(adv, extra) {
  const type = ["task", "goal", "challenge"].includes(adv.type) ? adv.type : "task";
  const frame = el("div", { class: "adv-frame" }, [
    el("img", { class: "frame", alt: "", src: `${ASSETS}/hud/${type}_frame${adv.percent === undefined ? "" : "_open"}.png` }),
    el("img", { class: "icon", alt: "", src: `${ASSETS}/item/${shortId(adv.icon)}.png` }),
  ]);
  const title = el("span", { class: "adv-title", text: adv.title });
  title.dataset.type = type;
  const body = el("div", { class: "adv-body" }, [title, el("span", { class: "adv-desc", text: adv.description || "" })]);
  const row = el("div", { class: "adv", title: adv.description || "" }, [frame, body]);
  if (extra) (extra.classList?.contains("bar") ? body : row).append(extra);
  return row;
}

function advancementsPanel(adv) {
  const children = [
    el("div", { class: "adv-total" }, [
      el("strong", { text: `${adv.done} / ${adv.total}` }),
      el("span", { text: `${adv.total ? Math.floor((adv.done / adv.total) * 100) : 0}% done` }),
    ]),
    bar(adv.total ? adv.done / adv.total : 0),
  ];
  const tabs = Object.entries(adv.tabs || {}).sort(([a], [b]) =>
    (Object.keys(ADV_TABS).indexOf(a) + 99) % 99 - (Object.keys(ADV_TABS).indexOf(b) + 99) % 99);
  if (tabs.length) {
    children.push(el("div", { class: "adv-tabs" }, tabs.map(([name, [done, total]]) => {
      const [icon, label] = ADV_TABS[name] || ["book", titleCase(name)];
      return el("div", { class: "adv-tab" }, [
        itemIcon(icon, ""), el("span", { text: label }), bar(total ? done / total : 0, { thin: true }), el("b", { text: `${done}/${total}` }),
      ]);
    })));
  }
  if (adv.recent?.length) {
    children.push(el("h3", { class: "subhead", text: "Recently earned" }));
    children.push(el("div", { class: "adv-list" }, adv.recent.map((item) =>
      advancementRow(item, item.at ? el("span", { class: "adv-when", text: timeAgo(item.at) }) : null))));
  }
  if (adv.in_progress?.length) {
    children.push(el("h3", { class: "subhead", text: "Almost there" }));
    children.push(el("div", { class: "adv-list" }, adv.in_progress.map((item) => {
      const row = advancementRow(item, bar(item.percent, { thin: true }));
      if (item.progress) row.append(el("span", { class: "adv-when", text: item.progress }));
      return row;
    })));
  }
  return panel("Advancements", children);
}

function statsPanel(stats, online) {
  const top = (entry, icon) => entry && entry.id ? icon(entry) : null;
  const mobIcon = (id) => `${shortId(id)}_spawn_egg`;
  const tiles = [
    tile("clock", "Play time", duration((stats.play_time ?? 0) / 20)),
    tile("bone", "Deaths", count(stats.deaths),
      stats.deaths ? `last ${duration((stats.time_since_death ?? 0) / 20)} ago` : "never died"),
    tile("iron_sword", "Mobs killed", count(stats.mob_kills)),
    tile("diamond_pickaxe", "Blocks mined", count(stats.blocks_mined)),
    tile("leather_boots", "Travelled", distance(stats.travel_cm), stats.flown_cm ? `${distance(stats.flown_cm)} by elytra` : null),
    tile("crafting_table", "Items crafted", count(stats.items_crafted)),
    tile("golden_sword", "Damage dealt", `${count(Math.round((stats.damage_dealt ?? 0) / 20))} ♥`),
    tile("iron_chestplate", "Damage taken", `${count(Math.round((stats.damage_taken ?? 0) / 20))} ♥`),
    tile("rabbit_foot", "Jumps", count(stats.jumps)),
    stats.fish_caught ? tile("cod", "Fish caught", count(stats.fish_caught)) : null,
    stats.animals_bred ? tile("wheat", "Animals bred", count(stats.animals_bred)) : null,
    stats.traded ? tile("emerald", "Villager trades", count(stats.traded)) : null,
    stats.enchanted ? tile("enchanting_table", "Items enchanted", count(stats.enchanted)) : null,
    stats.slept ? tile("red_bed", "Nights slept", count(stats.slept)) : null,
    stats.raids_won ? tile("ominous_bottle", "Raids won", count(stats.raids_won)) : null,
  ].filter(Boolean);
  const favourites = [
    top(stats.top_mined, (e) => tile(shortId(e.id), "Mined the most", itemName(e), `${count(e.count)} blocks`)),
    top(stats.top_crafted, (e) => tile(shortId(e.id), "Crafted the most", itemName(e), `${count(e.count)} made`)),
    top(stats.top_killed, (e) => tile(mobIcon(e.id), "Hunted the most", entityName(e.id), `${count(e.count)} killed`)),
    top(stats.top_killed_by, (e) => tile(mobIcon(e.id), "Nemesis", entityName(e.id), `killed you ${count(e.count)}×`)),
  ].filter(Boolean);
  const children = [
    el("div", { class: "panel-head" }, [el("h2", { text: "Statistics" }), online ? "" : el("small", { text: "as of the last session" })]),
    el("div", { class: "tiles" }, tiles),
  ];
  if (favourites.length) {
    children.push(el("h3", { class: "subhead", text: "Favourites" }), el("div", { class: "tiles" }, favourites));
  }
  return el("section", { class: "panel stats-panel" }, children);
}

function playtimePanel(days) {
  const most = Math.max(...days.map((day) => day.seconds), 1);
  const total = days.reduce((sum, day) => sum + day.seconds, 0);
  const short = (s) => (s < 60 ? "" : s < 3600 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(s < 36000 ? 1 : 0)}h`);
  const chart = el("div", { class: "pt-chart", role: "img" });
  chart.setAttribute("aria-label", days.map((day) => `${day.date}: ${duration(day.seconds)}`).join(", "));
  days.forEach((day, index) => {
    const today = index === days.length - 1;
    const weekday = new Date(`${day.date}T12:00:00`).toLocaleDateString("en-US", { weekday: "short" });
    const fill = el("i");
    fill.style.height = `${day.seconds ? Math.max(4, (day.seconds / most) * 100) : 0}%`;
    const column = el("div", { class: "pt-day", title: `${day.date}: ${duration(day.seconds)}` }, [
      el("span", { class: "pt-value", text: short(day.seconds) }),
      el("div", { class: "pt-track" }, [fill]),
      el("span", { class: "pt-label", text: today ? "Today" : weekday }),
    ]);
    if (today) column.dataset.today = "true";
    chart.append(column);
  });
  return el("section", { class: "panel" }, [
    el("div", { class: "panel-head" }, [el("h2", { text: "Play time" }), el("small", { text: `${duration(total)} this week` })]),
    chart,
  ]);
}

function setPill(state, text) {
  const pill = document.getElementById("live-pill");
  pill.hidden = !state;
  pill.dataset.state = state || "";
  pill.textContent = text || "";
}

// A centered card for everything that isn't the live view.
function showScreen(icon, title, detail, action) {
  lastData = null;
  setPill(null);
  const card = el("section", { class: "panel card-narrow" }, [
    itemIcon(icon),
    el("h1", { text: title }),
    el("p", { text: detail }),
  ]);
  if (action) card.append(action);
  document.getElementById("root").replaceChildren(el("div", { class: "center" }, [card]));
}

function retryButton() {
  const button = el("button", { type: "button", class: "btn btn-green", text: "Try again" });
  button.addEventListener("click", () => connect());
  return button;
}

// ---- join screen -------------------------------------------------------------------

function showJoin(error = "") {
  disconnect();
  lastData = null;
  setPill(null);
  document.getElementById("forget-key").hidden = true;

  const input = el("input", {
    id: "invite-key", name: "key", type: "text", autocomplete: "off", autocapitalize: "off",
    spellcheck: "false", placeholder: "Paste your invite key", required: "",
  });
  const message = el("p", { class: "error", id: "key-error", role: "alert", text: error });
  if (error) input.setAttribute("aria-invalid", "true");
  input.setAttribute("aria-describedby", "key-error");
  input.addEventListener("input", () => {
    message.textContent = "";
    input.removeAttribute("aria-invalid");
  });

  const submit = el("button", { type: "submit", class: "btn btn-green", text: "Join" });
  const form = el("form", { novalidate: "" }, [
    el("div", { class: "field" }, [el("label", { for: "invite-key", text: "Invite key" }), input, message]),
    submit,
  ]);
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    // accept the whole invite link too, not just the key
    const raw = input.value.trim();
    const fromLink = raw.match(/[#&]key=([^&\s]+)/);
    const key = fromLink ? decodeURIComponent(fromLink[1]) : raw;
    if (!key) {
      message.textContent = "Enter your invite key first.";
      input.setAttribute("aria-invalid", "true");
      input.focus();
      return;
    }
    submit.textContent = "Joining…";
    submit.disabled = true;
    rememberInviteKey(key);
    connect();
  });

  const card = el("section", { class: "panel card-narrow" }, [
    itemIcon("grass_block"),
    el("h1", { text: "Watch live" }),
    el("p", { text: "This page is invite-only. Enter the key from your invite to see what's happening in game." }),
    form,
    el("p", { class: "hint", text: "Got an invite link instead? Opening it signs you in automatically." }),
  ]);
  document.getElementById("root").replaceChildren(el("div", { class: "center" }, [card]));
  input.focus();
}

// ---- the live view --------------------------------------------------------------------

const dimensionName = (id) => {
  const short = (id || "").replace(/^minecraft:/, "");
  return { overworld: "Overworld", the_nether: "The Nether", the_end: "The End" }[short] || short.replace(/_/g, " ");
};
const coords = (position) => position.map((n) => Math.round(n)).join("  ");

function avatar(name) {
  const box = el("div", { class: "avatar" });
  const head = el("img", { alt: "", src: `https://mc-heads.net/avatar/${encodeURIComponent(name || "MHF_Steve")}/64` });
  // skin service down or blocked: the game's own player head
  head.addEventListener("error", () => { head.src = `${ASSETS}/item/player_head.png`; }, { once: true });
  box.append(head);
  return box;
}

function render(data) {
  lastData = data;
  document.getElementById("forget-key").hidden = false;
  const root = document.getElementById("root");
  const age = Date.now() - (data.received_at || data.generated_at || 0);
  const player = data.player || {};
  const system = data.system || {};

  if (age > STALE_MS && !data.last_seen && !hasInventory(player)) {
    showScreen("clock", "The machine went quiet", `Last heard from it ${Math.round(age / 60000)} min ago. This page updates by itself.`);
    return;
  }

  const online = player.online && age <= STALE_MS;
  // On someone's server only status and inventory are shown: no coordinates,
  // no screenshot, no map marker (the agent doesn't even send them).
  const multiplayer = player.mode === "multiplayer";
  const seen = data.last_seen || {};
  const seenOnServer = !online && seen.mode === "multiplayer";

  if (online) setPill(multiplayer ? "server" : "online", multiplayer ? "On a server" : "In game");
  else if (age > STALE_MS) setPill("quiet", "Quiet");
  else setPill("offline", "Offline");

  // ---- hero ----
  const shotSrc = shotUrl || (pollTimer && data.screenshot_at && inviteKey
    ? `${API}/shot?key=${encodeURIComponent(inviteKey)}&t=${data.screenshot_at}` : null);
  const showShot = Boolean(data.screenshot_at && shotSrc && !(online && multiplayer));

  const scene = el("div", { class: "scene" });
  if (showShot) {
    scene.style.backgroundImage = `url("${shotSrc}")`;
    scene.setAttribute("role", "img");
    scene.setAttribute("aria-label", "The most recent frame of the world.");
    scene.append(el("span", { class: "scene-chip", text: `Captured ${timeAgo(data.screenshot_at)}` }));
  }
  if (!online) {
    scene.dataset.offline = "true";
    scene.append(el("div", { class: "scene-note" }, [
      el("strong", { text: "Logged out" }),
      el("span", { text: seen.at ? `Last seen ${timeAgo(seen.at)}` : "Not in a world right now" }),
    ]));
  } else if (online && multiplayer) {
    scene.append(el("div", { class: "scene-note" }, [
      el("strong", { text: "On a server" }),
      el("span", { text: "No frames or coordinates from other people's worlds." }),
    ]));
  }
  // offline these are what you logged out with, greyed out with the frame
  if (glyphWidths && typeof player.health === "number") {
    scene.append(el("div", { class: "vitals-dock" }, [vitalsNode(player)]));
  }
  const fresh = player.advancements?.recent?.[0];
  if (glyphWidths && online && !multiplayer && fresh?.at && Date.now() - fresh.at < TOAST_MS) {
    scene.append(el("div", { class: "toast-dock" }, [toastNode(fresh)]));
  }

  const chips = el("div", { class: "chips" });
  if (online && multiplayer) {
    chips.append(chip("", "Multiplayer server"));
  } else if (online) {
    if (player.dimension) chips.append(chip("", dimensionName(player.dimension)));
    if (player.position) chips.append(chip("XYZ", coords(player.position)));
  } else if (seenOnServer) {
    chips.append(chip("Last on", "a multiplayer server"));
  } else if (seen.at) {
    if (seen.dimension) chips.append(chip("Last in", dimensionName(seen.dimension)));
    if (seen.position) chips.append(chip("XYZ", coords(seen.position)));
  }
  if (online && player.joined_at) chips.append(chip("Playing for", duration((Date.now() - player.joined_at) / 1000)));
  if (online && !glyphWidths) {
    chips.append(chip("Health", `${Math.ceil(player.health ?? 0) / 2} ♥`), chip("Food", `${(player.foodlevel ?? 0) / 2}`), chip("Level", String(player.xplevel ?? 0)));
  }

  const identity = el("div", { class: "identity" }, [
    avatar(player.name),
    el("div", { class: "who" }, [el("h1", { text: player.name || "Unknown player" }), chips]),
  ]);
  const hero = el("section", { class: "panel hero" }, [scene, identity]);

  // ---- cards ----
  const left = el("div", { class: "col" });
  const right = el("div", { class: "col" });

  if (hasInventory(player)) {
    left.append(panel(online ? "Inventory" : "Logged out with", [
      glyphWidths
        ? el("div", { class: "inventory-well" }, [inventoryNode(player)])
        : plainStats(player),
    ]));
  } else {
    left.append(panel("Inventory", [el("p", { class: "empty", text: "Nothing in the inventory." })]));
  }
  // your own worlds only: the agent never sends these for servers
  if (player.advancements?.total) left.append(advancementsPanel(player.advancements));

  if (online && !multiplayer && player.world) right.append(worldPanel(player.world));
  if (Object.keys(system).length) right.append(machinePanel(system, player.game, online));
  if (Array.isArray(data.playtime) && data.playtime.some((day) => day.seconds >= 60)) right.append(playtimePanel(data.playtime));

  const mapButton = document.getElementById("map-button");
  mapButton.hidden = !mapInfo;
  if (mapInfo) {
    const button = el("a", { class: "btn btn-green", href: "map/", text: "Open world map" });
    right.append(panel("World map", [
      el("p", { text: mapInfo.center
        ? `A 3D map of the area around ${player.name || "the"} last logout, rendered ${timeAgo(mapInfo.rendered_at)}.`
        : `A 3D map of the world, rendered ${timeAgo(mapInfo.rendered_at)}.` }),
      button,
    ], "map-card"));
  }

  if (Array.isArray(data.curses) && data.curses.length) {
    right.append(panel("Recent curses", [statRows(data.curses.map((curse) => [
      curse.name,
      `${CURSE_UNITS[curse.metric] ? Math.round(curse.value) + CURSE_UNITS[curse.metric] : curse.value} · ${timeAgo(curse.at)}`,
    ]))]));
  }

  const grid = el("div", { class: "grid" }, [left]);
  if (right.childElementCount) grid.append(right);
  else grid.style.gridTemplateColumns = "minmax(0, 1fr)";

  const sections = [hero, grid];
  if (player.stats && !multiplayer) sections.push(statsPanel(player.stats, online));

  const activeKey = tooltipKey;
  root.replaceChildren(...sections);
  fitPixels();
  // updates re-render everything; keep an open tooltip attached to its slot
  if (activeKey) {
    const again = root.querySelector(`[data-key="${activeKey}"]`);
    if (again) again.dispatchEvent(new Event("focus"));
    else hideTooltip();
  }
}

const CURSE_UNITS = { cpu_temp: " °C", gpu_temp: " °C", cpu_percent: "%", gpu_percent: "%", mem_percent: "%", uptime_hours: " h" };

function timeAgo(ms) {
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  if (minutes < 48 * 60) return `${Math.round(minutes / 60)} h ago`;
  return `${Math.round(minutes / 1440)} days ago`;
}

// The map is rendered separately and may not exist yet; only link it if it does.
let mapInfo = null;
fetch("map/mc-status.json", { cache: "no-store" })
  .then((response) => (response.ok ? response.json() : null))
  .then((info) => {
    mapInfo = info;
    if (mapInfo && lastData) render(lastData);
  })
  .catch(() => {});

// ---- invite key --------------------------------------------------------------------

// Arrives typed into the join form, or as nyannoying.de/#key=… (a fragment never
// reaches GitHub). Remembered on this device and removed from the address bar.
const KEY_STORAGE = "mc-status-invite";

function rememberInviteKey(key) {
  inviteKey = key;
  try { localStorage.setItem(KEY_STORAGE, key); } catch { /* private mode: works for this visit */ }
}

function readInviteKey() {
  const match = location.hash.match(/(?:^#|&)key=([^&]+)/);
  if (match) {
    const key = decodeURIComponent(match[1]);
    try { localStorage.setItem(KEY_STORAGE, key); } catch { /* private mode */ }
    history.replaceState(null, "", location.pathname + location.search);
    return key;
  }
  try { return localStorage.getItem(KEY_STORAGE); } catch { return null; }
}

function forgetInviteKey() {
  inviteKey = null;
  try { localStorage.removeItem(KEY_STORAGE); } catch { /* nothing stored */ }
}

document.getElementById("forget-key").addEventListener("click", () => {
  forgetInviteKey();
  showJoin();
});

// ---- live connection --------------------------------------------------------------

// One WebSocket per viewer. The Worker pushes every status and frame as the
// agent sends them, so an open tab costs one request instead of polling.
let inviteKey = readInviteKey();
let lastData = null;
let shotUrl = null;
let socket = null;
let closingOnPurpose = false;
let failures = 0;
let retryTimer = null;
let pollTimer = null;
let hiddenTimer = null;

function connect() {
  clearTimeout(retryTimer);
  if (!inviteKey) {
    showJoin();
    return;
  }
  if (socket || document.hidden) return;

  closingOnPurpose = false;
  const ws = new WebSocket(`${API.replace(/^http/, "ws")}/live?key=${encodeURIComponent(inviteKey)}`);
  ws.binaryType = "blob";
  socket = ws;

  ws.addEventListener("open", () => {
    failures = 0;
    stopPolling();
  });

  ws.addEventListener("message", async (event) => {
    if (typeof event.data !== "string") {
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotUrl = URL.createObjectURL(event.data);
      if (lastData) render(lastData);
      return;
    }
    const message = JSON.parse(event.data);
    if (message.type === "status") {
      await assetsReady;
      render(message.status);
    } else if (message.type === "empty") {
      showScreen("clock", "Nothing reported yet", "The agent hasn't sent anything. This page updates by itself.");
    }
  });

  ws.addEventListener("close", (event) => {
    if (socket === ws) socket = null;
    if (event.code === 4001) {
      forgetInviteKey();
      showJoin("That key didn't work. Check it, or ask for a new invite.");
      return;
    }
    if (event.code === 4003) {
      showScreen("spyglass", "Too many people are watching", `Only ${MAX_VIEWERS} people can watch at once. Try again in a bit.`, retryButton());
      return;
    }
    if (closingOnPurpose) return;
    failures += 1;
    if (failures >= 3) startPolling();
    else if (!lastData) showScreen("redstone_torch", "Can't reach the server", "Retrying by itself.");
    retryTimer = setTimeout(connect, Math.min(300000, 2000 * 2 ** (failures - 1)));
  });
}

function disconnect() {
  closingOnPurpose = true;
  clearTimeout(retryTimer);
  if (socket) socket.close(1000, "closing");
  socket = null;
  stopPolling();
}

// Fallback for networks that block WebSockets: a keyed poll once a minute.
async function poll() {
  if (document.hidden || !inviteKey) return;
  try {
    const response = await fetch(`${API}/status?key=${encodeURIComponent(inviteKey)}`, { cache: "no-store" });
    if (response.status === 401) {
      forgetInviteKey();
      showJoin("That key didn't work. Check it, or ask for a new invite.");
      return;
    }
    if (response.status === 404) {
      showScreen("clock", "Nothing reported yet", "The agent hasn't sent anything yet.");
      return;
    }
    await assetsReady;
    render(await response.json());
  } catch {
    if (!lastData) showScreen("redstone_torch", "Can't reach the server", "Retrying by itself.");
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(poll, FALLBACK_POLL_MS);
  poll();
}

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    hiddenTimer = setTimeout(disconnect, HIDDEN_GRACE_MS);
  } else {
    clearTimeout(hiddenTimer);
    if (inviteKey) connect();
  }
});

// keep-alive, answered by Cloudflare without waking anything (and not billed)
setInterval(() => {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send("ping");
}, 45000);

// "3 min ago" labels age locally; no requests
setInterval(() => {
  if (lastData && !document.hidden && !tooltipPinned) render(lastData);
}, 30000);

fitPixels();
connect();
</script>
</body>
</html>
