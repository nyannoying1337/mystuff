<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status</title>
<meta name="description" content="Live machine and Minecraft status.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root {
  --panel: #c6c6c6;
  --panel-light: #ffffff;
  --panel-dark: #555555;
  --slot-dark: #373737;
  --ink: #3f3f3f;
  --ink-dim: #6d6d6d;
  --xp: #7fb238;
  --xp-dark: #4e7020;
}

* { box-sizing: border-box; }

html {
  background: #2b2118;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 4px, transparent 4px 8px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px);
}

body {
  margin: 0;
  padding: clamp(12px, 4vw, 40px) clamp(10px, 4vw, 24px);
  font-family: "Press Start 2P", ui-monospace, monospace;
  font-size: 10px;
  line-height: 2;
  color: var(--ink);
  -webkit-font-smoothing: none;
}

img { image-rendering: pixelated; }

main { max-width: 560px; margin: 0 auto; }

.panel {
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 14px;
  margin-bottom: 14px;
}

.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

h1 { font-size: 14px; margin: 0; font-weight: 400; }

.badge {
  padding: 5px 7px;
  color: #173404;
  background: var(--xp);
  border-top: 2px solid #a5d45e;
  border-left: 2px solid #a5d45e;
  border-right: 2px solid var(--xp-dark);
  border-bottom: 2px solid var(--xp-dark);
}
.badge[data-state="offline"] {
  color: #4b1528;
  background: #a94b4b;
  border-top-color: #cf7676;
  border-left-color: #cf7676;
  border-right-color: #6d2626;
  border-bottom-color: #6d2626;
}

h2 {
  font-size: 10px;
  font-weight: 400;
  color: var(--ink-dim);
  margin: 0 0 8px;
}

.viewport {
  background: #1c2230;
  background-image: linear-gradient(#5a7bb5, #9dbbe8 60%, #4d6b3a 60%, #3b5230);
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
  padding: 18px 10px 10px;
  margin-bottom: 14px;
}
/* Game GUIs laid out in native GUI pixels and scaled as one: the HUD (182×39)
   and the inventory screen (176×166). */
.gui { position: relative; margin: 0 auto; }
.gui > * { position: absolute; display: block; }
.hud { width: min(100%, 546px); }
.inventory { width: min(100%, 528px); margin-bottom: 4px; }
.slot-hit {
  padding: 0;
  border: 0;
  background: transparent;
  cursor: help;
}
.slot-hit:hover { background: rgba(255, 255, 255, .5); }
.slot-hit:focus-visible { outline: 2px solid #ffffff; outline-offset: 0; }

.tooltip {
  position: fixed;
  z-index: 10;
  max-width: min(320px, calc(100vw - 16px));
  padding: 6px 8px;
  font-size: 8px;
  line-height: 1.9;
  color: #ffffff;
  background: rgba(16, 0, 16, .94);
  border: 2px solid #28007f;
  outline: 2px solid rgba(16, 0, 16, .94);
  box-shadow: inset 0 0 0 1px #5000ff;
  pointer-events: none;
  text-shadow: 1px 1px 0 #3f3f3f;
}
.tooltip .title { color: #ffffff; }
.tooltip .title[data-enchanted="true"] { color: #55ffff; }
.tooltip .custom { font-style: italic; }
.tooltip .line { color: #aaaaaa; }
.glyph {
  mask-size: 100% 100%;
  -webkit-mask-size: 100% 100%;
  mask-repeat: no-repeat;
  -webkit-mask-repeat: no-repeat;
}
.swatch { outline: 1px solid rgba(0,0,0,.35); outline-offset: -1px; }
.glint {
  mask-size: 100% 100%;
  -webkit-mask-size: 100% 100%;
  background-image: url("assets/mc/glint.png");
  background-size: 400% 400%;
  mix-blend-mode: screen;
  opacity: .7;
  animation: glint 7s linear infinite;
  pointer-events: none;
}
@keyframes glint {
  from { background-position: 0% 0%; }
  to { background-position: 100% 133%; }
}
@media (prefers-reduced-motion: reduce) {
  .glint { animation: none; }
}

.shot {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #000000;
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
}
.caption { color: var(--ink-dim); margin-top: 6px; }

dl { margin: 0; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 2px solid rgba(85,85,85,.25);
  padding: 3px 0;
}
.row:last-child { border-bottom: 0; }
.row dt { color: var(--ink-dim); }
.row dd { margin: 0; text-align: right; word-break: break-word; }

.map-link { display: block; text-align: center; color: var(--ink); }
.map-link:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }

.disconnect { text-align: center; padding: 22px 14px; }
.disconnect p { margin: 0 0 14px; line-height: 2.2; }
.disconnect p:last-child { margin: 0; color: var(--ink-dim); }

button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 10px 16px;
  cursor: pointer;
}
button:hover { background: #d6d6d6; }
button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
button:active {
  border-top-color: var(--panel-dark);
  border-left-color: var(--panel-dark);
  border-right-color: var(--panel-light);
  border-bottom-color: var(--panel-light);
}

.disclaimer {
  max-width: 560px;
  margin: 6px auto 0;
  text-align: center;
  font-size: 8px;
  line-height: 2.2;
  color: #cbbfae;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
</style>
</head>
<body>

<main>
  <h1 class="sr-only">Live status</h1>
  <div id="root" aria-live="polite">
    <section class="panel disconnect">
      <p>Connecting…</p>
    </section>
  </div>
</main>

<footer class="disclaimer">
  NOT AN OFFICIAL MINECRAFT WEBSITE. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
</footer>

<script>
const API = "https://status-api.nyannoying.de";
const STALE_MS = 90000;
const MAX_VIEWERS = 10;          // must match the Worker
const FALLBACK_POLL_MS = 60000;  // only if WebSockets keep failing
const HIDDEN_GRACE_MS = 60000;   // a background tab gives its viewer slot back after this

// Built at deploy time by site/build_assets.py from the Minecraft client jar.
const ASSETS = "assets/mc";

// Glyph widths for the game font and English names; false when the assets
// weren't built, in which case the page falls back to plain text.
let glyphWidths = null;
let names = { items: {}, enchantments: {}, levels: {} };
const assetsReady = Promise.all([
  fetch(`${ASSETS}/font/widths.json`).then((r) => (r.ok ? r.json() : false)).catch(() => false),
  fetch(`${ASSETS}/names.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
]).then(([widths, loadedNames]) => {
  glyphWidths = widths;
  if (loadedNames) names = loadedNames;
});

function colorFor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360} 42% 46%)`;
}

function itemName(item) {
  const short = item.id.replace(/^minecraft:/, "");
  return names.items[short] || short.replace(/_/g, " ");
}

// Enchantments that only have one level; the game shows them without "I".
const SINGLE_LEVEL = new Set([
  "mending", "silk_touch", "infinity", "flame", "channeling", "multishot",
  "aqua_affinity", "binding_curse", "vanishing_curse",
]);

function enchantmentName(enchantment) {
  const short = enchantment.id.replace(/^minecraft:/, "");
  const name = names.enchantments[short] || short.replace(/_/g, " ");
  if (SINGLE_LEVEL.has(short) && enchantment.level === 1) return name;
  return `${name} ${names.levels[String(enchantment.level)] || enchantment.level}`;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

// ---- game GUI drawing --------------------------------------------------------

// A box measured in GUI pixels; children are placed by percentage so the whole
// thing scales crisply as one image would.
function makeGui(width, height, className) {
  const node = el("div", { class: `gui ${className}` });
  node.style.aspectRatio = `${width} / ${height}`;
  return {
    node,
    add(child, x, y, w, h) {
      child.style.left = `${(x / width) * 100}%`;
      child.style.top = `${(y / height) * 100}%`;
      child.style.width = `${(w / width) * 100}%`;
      child.style.height = `${(h / height) * 100}%`;
      node.append(child);
      return child;
    },
  };
}

function sprite(gui, name, x, y, w, h) {
  return gui.add(el("img", { src: `${ASSETS}/hud/${name}.png`, alt: "" }), x, y, w, h);
}

function fill(gui, x, y, w, h, color) {
  const node = gui.add(el("div"), x, y, w, h);
  node.style.background = color;
  return node;
}

function masked(node, url) {
  node.style.maskImage = `url("${url}")`;
  node.style.webkitMaskImage = `url("${url}")`;
  return node;
}

function textWidth(text) {
  let width = 0;
  for (const char of text) width += (glyphWidths[char] ?? 5) + 1;
  return width;
}

function drawText(gui, text, x, y, color) {
  let cursor = x;
  for (const char of text) {
    const width = glyphWidths[char];
    if (width === undefined) { cursor += 6; continue; }
    const glyph = gui.add(el("div", { class: "glyph" }), cursor, y, width, 8);
    masked(glyph, `${ASSETS}/font/${char.charCodeAt(0)}.png`);
    glyph.style.background = color;
    cursor += width + 1;
  }
}

function drawShadowText(gui, text, x, y) {
  drawText(gui, text, x + 1, y + 1, "#3f3f3f");
  drawText(gui, text, x, y, "#ffffff");
}

// One item at slot position (x, y), drawn like the game: icon, glint, count,
// durability bar, plus an invisible button that shows the tooltip.
function drawItem(gui, item, x, y, key) {
  const short = item.id.startsWith("minecraft:") ? item.id.slice(10) : null;
  const url = `${ASSETS}/item/${short}.png`;

  const swatch = () => {
    const node = el("div", { class: "swatch" });
    node.style.background = colorFor(item.id);
    return node;
  };

  if (short) {
    const icon = gui.add(el("img", { src: url, alt: "" }), x, y, 16, 16);
    // banners, shields, modded items…: no rendered icon, show a colour swatch
    icon.addEventListener("error", () => icon.replaceWith(gui.add(swatch(), x + 2, y + 2, 12, 12)), { once: true });
    if (item.enchanted) masked(gui.add(el("div", { class: "glint" }), x, y, 16, 16), url);
  } else {
    gui.add(swatch(), x + 2, y + 2, 12, 12);
  }

  if (item.count > 1) {
    const text = String(item.count);
    drawShadowText(gui, text, x + 19 - 2 - textWidth(text), y + 9);
  }

  if (item.damage && item.max_damage) {
    const left = Math.max(0, (item.max_damage - item.damage) / item.max_damage);
    const width = Math.round(13 - (item.damage * 13) / item.max_damage);
    fill(gui, x + 2, y + 13, 13, 2, "#000000");
    fill(gui, x + 2, y + 13, Math.max(0, width), 1, `hsl(${Math.round(left * 120)} 100% 50%)`);
  }

  const hit = gui.add(el("button", {
    type: "button",
    class: "slot-hit",
    "aria-label": tooltipLines(item).map((line) => line.text).join(", "),
    "data-key": key,
  }), x, y, 16, 16);
  bindTooltip(hit, item);
}

// ---- tooltips ------------------------------------------------------------------

const tooltip = el("div", { class: "tooltip", role: "tooltip", hidden: "" });
document.body.append(tooltip);
let tooltipKey = null;
let tooltipPinned = false;

function tooltipLines(item) {
  const lines = [item.name
    ? { text: item.name, cls: "title custom" }
    : { text: itemName(item), cls: "title" }];
  for (const enchantment of item.enchantments || []) lines.push({ text: enchantmentName(enchantment), cls: "line" });
  if (item.max_damage) {
    lines.push({ text: `Durability: ${item.max_damage - (item.damage || 0)} / ${item.max_damage}`, cls: "line" });
  }
  return lines;
}

function showTooltip(item, key, anchor) {
  tooltip.replaceChildren(...tooltipLines(item).map((line) => {
    const row = el("div", { class: line.cls, text: line.text });
    if (line.cls.includes("title") && item.enchanted) row.dataset.enchanted = "true";
    return row;
  }));
  tooltip.hidden = false;
  tooltipKey = key;
  if (anchor) {
    const rect = anchor.getBoundingClientRect();
    moveTooltip(rect.right + 6, rect.top - 4);
  }
}

function moveTooltip(x, y) {
  const width = tooltip.offsetWidth;
  const height = tooltip.offsetHeight;
  const left = Math.min(x, window.innerWidth - width - 8);
  const top = Math.min(Math.max(8, y), window.innerHeight - height - 8);
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${top}px`;
}

function hideTooltip() {
  tooltip.hidden = true;
  tooltipKey = null;
  tooltipPinned = false;
}

function bindTooltip(button, item) {
  const key = button.dataset.key;
  button.addEventListener("pointerenter", (event) => {
    if (event.pointerType !== "mouse") return;
    showTooltip(item, key, null);
    moveTooltip(event.clientX + 12, event.clientY - 16);
  });
  button.addEventListener("pointermove", (event) => {
    if (event.pointerType === "mouse" && tooltipKey === key && !tooltipPinned) {
      moveTooltip(event.clientX + 12, event.clientY - 16);
    }
  });
  button.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse" && !tooltipPinned) hideTooltip();
  });
  button.addEventListener("focus", () => showTooltip(item, key, button));
  button.addEventListener("blur", () => { if (!tooltipPinned) hideTooltip(); });
  // taps: pin it until the next tap elsewhere
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    if (tooltipPinned && tooltipKey === key) { hideTooltip(); return; }
    showTooltip(item, key, button);
    tooltipPinned = true;
  });
}

document.addEventListener("click", () => { if (tooltipPinned) hideTooltip(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideTooltip(); });

// ---- HUD and inventory ---------------------------------------------------------

function hudNode(player) {
  const health = Math.ceil(player.health ?? 0);
  const food = player.foodlevel ?? 0;
  const level = player.xplevel ?? 0;
  const gui = makeGui(182, 39, "hud");
  gui.node.setAttribute("aria-label", `${health / 2} of 10 hearts, hunger ${food / 2} of 10, level ${level}`);
  gui.node.setAttribute("role", "group");

  for (let i = 0; i < 10; i++) {
    const x = i * 8;
    sprite(gui, "heart_container", x, 0, 9, 9);
    if (i * 2 + 1 < health) sprite(gui, "heart_full", x, 0, 9, 9);
    else if (i * 2 + 1 === health) sprite(gui, "heart_half", x, 0, 9, 9);
  }
  for (let i = 0; i < 10; i++) {
    const x = 182 - i * 8 - 9;
    sprite(gui, "food_empty", x, 0, 9, 9);
    if (i * 2 + 1 < food) sprite(gui, "food_full", x, 0, 9, 9);
    else if (i * 2 + 1 === food) sprite(gui, "food_half", x, 0, 9, 9);
  }

  sprite(gui, "xp_background", 0, 10, 182, 5);
  const progress = Math.min(182, Math.floor((player.xpp ?? 0) * 183));
  if (progress > 0) {
    const clip = gui.add(el("div"), 0, 10, progress, 5);
    clip.style.overflow = "hidden";
    const bar = el("img", { src: `${ASSETS}/hud/xp_progress.png`, alt: "" });
    bar.style.cssText = `position:absolute;left:0;top:0;height:100%;width:${(182 / progress) * 100}%`;
    clip.append(bar);
  }
  if (level > 0) {
    const text = String(level);
    const x = Math.floor((182 - textWidth(text)) / 2);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) drawText(gui, text, x + dx, 4 + dy, "#000000");
    drawText(gui, text, x, 4, "#80ff20");
  }

  sprite(gui, "hotbar", 0, 17, 182, 22);
  sprite(gui, "hotbar_selection", -1 + (player.selecteditemslot ?? 0) * 20, 16, 24, 23);
  for (const item of player.hotbar || []) drawItem(gui, item, 3 + item.slot * 20, 20, `hud-${item.slot}`);

  return el("div", { class: "viewport" }, [gui.node]);
}

const ARMOR_SLOTS = [["head", "slot_helmet"], ["chest", "slot_chestplate"], ["legs", "slot_leggings"], ["feet", "slot_boots"]];

// The survival inventory screen, slots where the game puts them.
function inventoryNode(player) {
  const gui = makeGui(176, 166, "inventory");
  gui.node.setAttribute("role", "group");
  gui.node.setAttribute("aria-label", "Inventory");
  sprite(gui, "inventory", 0, 0, 176, 166);

  const armor = player.armor || {};
  ARMOR_SLOTS.forEach(([slot, empty], i) => {
    const y = 8 + i * 18;
    if (armor[slot]) drawItem(gui, armor[slot], 8, y, `armor-${slot}`);
    else sprite(gui, empty, 8, y, 16, 16);
  });
  if (player.offhand) drawItem(gui, player.offhand, 77, 62, "offhand");
  else sprite(gui, "slot_shield", 77, 62, 16, 16);

  for (const item of player.inventory || []) {
    const index = item.slot - 9;
    if (index < 0 || index >= 27) continue;
    drawItem(gui, item, 8 + (index % 9) * 18, 84 + Math.floor(index / 9) * 18, `inv-${item.slot}`);
  }
  for (const item of player.hotbar || []) {
    drawItem(gui, item, 8 + item.slot * 18, 142, `bar-${item.slot}`);
  }
  return gui.node;
}

function hasInventory(player) {
  return Boolean((player.hotbar || []).length || (player.inventory || []).length
    || Object.keys(player.armor || {}).length || player.offhand);
}

// Used when the icon assets weren't built: the same facts, as text.
function plainStats(player) {
  const list = (items) => (items || []).map((item) => `${itemName(item)} ×${item.count}`).join(", ") || "empty";
  return statRows([
    ["health", `${Math.ceil(player.health ?? 0)} / 20`],
    ["food", `${player.foodlevel ?? 0} / 20`],
    ["level", player.xplevel ?? 0],
    ["hotbar", list(player.hotbar)],
    ["inventory", list(player.inventory)],
  ]);
}

// ---- panels ------------------------------------------------------------------

function statRows(pairs) {
  const list = el("dl");
  for (const [label, value] of pairs) {
    if (value === null || value === undefined || value === "") continue;
    list.append(el("div", { class: "row" }, [
      el("dt", { text: label }),
      el("dd", { text: String(value) }),
    ]));
  }
  return list;
}

function noticePanel(title, detail, retry = true) {
  const panel = el("section", { class: "panel disconnect" }, [
    el("p", { text: title }),
    el("p", { text: detail }),
  ]);
  if (retry) {
    const button = el("button", { type: "button", text: "Try again" });
    button.addEventListener("click", () => connect());
    panel.append(button);
  }
  return panel;
}

function showNotice(title, detail, retry = true) {
  lastData = null;
  document.getElementById("root").replaceChildren(noticePanel(title, detail, retry));
}

const dimensionName = (id) => (id || "").replace(/^minecraft:/, "").replace(/^the_/, "the ");
const coords = (position) => (position ? position.map((n) => Math.round(n)).join("  ") : "hidden");

function render(data) {
  lastData = data;
  const root = document.getElementById("root");
  const frag = document.createDocumentFragment();
  const age = Date.now() - (data.received_at || data.generated_at || 0);
  const player = data.player || {};
  const system = data.system || {};

  if (age > STALE_MS && !data.last_seen && !hasInventory(player)) {
    root.replaceChildren(noticePanel(
      "The machine went quiet",
      `Last heard from it ${Math.round(age / 60000)} min ago. This updates by itself.`,
      false,
    ));
    return;
  }

  const online = player.online && age <= STALE_MS;
  const status = el("section", { class: "panel" });
  const badge = el("span", { class: "badge", text: online ? "in game" : "not playing" });
  badge.dataset.state = online ? "online" : "offline";
  status.append(el("div", { class: "head" }, [el("h1", { text: player.name || "status" }), badge]));

  if (online) {
    status.append(glyphWidths ? hudNode(player) : plainStats(player));
    status.append(statRows([
      ["x y z", coords(player.position)],
      ["dimension", dimensionName(player.dimension)],
    ]));
  } else if (data.last_seen) {
    status.append(statRows([
      ["last seen", timeAgo(data.last_seen.at)],
      ["where", dimensionName(data.last_seen.dimension)],
      ["x y z", coords(data.last_seen.position)],
    ]));
  } else {
    status.append(el("p", { text: "No world loaded right now." }));
  }
  frag.append(status);

  if (glyphWidths && hasInventory(player)) {
    const inventory = el("section", { class: "panel" }, [
      el("h2", { text: online ? "Inventory" : "Logged out with" }),
      inventoryNode(player),
    ]);
    frag.append(inventory);
  } else if (!glyphWidths && !online && hasInventory(player)) {
    frag.append(el("section", { class: "panel" }, [el("h2", { text: "Logged out with" }), plainStats(player)]));
  }

  // The frame arrives over the socket as a blob; only the polling fallback fetches it.
  const shotSrc = shotUrl || (pollTimer && data.screenshot_at && inviteKey
    ? `${API}/shot?key=${encodeURIComponent(inviteKey)}&t=${data.screenshot_at}` : null);
  if (data.screenshot_at && shotSrc) {
    const shot = el("section", { class: "panel" }, [el("h2", { text: "Last thing seen" })]);
    const image = el("img", { class: "shot", alt: "The most recent frame of the world." });
    image.src = shotSrc;
    shot.append(image);
    shot.append(el("div", { class: "caption", text: `captured ${timeAgo(data.screenshot_at)}` }));
    frag.append(shot);
  }

  if (Object.keys(system).length) {
    const machine = el("section", { class: "panel" }, [el("h2", { text: "The machine" })]);
    machine.append(statRows([
      ["os", system.os],
      ["kernel", system.kernel],
      ["desktop", system.de],
      ["cpu", system.cpu],
      ["cpu temp", system.cpu_temp ? `${Math.round(system.cpu_temp)} c` : null],
      ["gpu", system.gpu],
      ["gpu temp", system.gpu_temp ? `${Math.round(system.gpu_temp)} c` : null],
      ["uptime", system.uptime && system.uptime.uptime
        ? `${Math.floor(system.uptime.uptime / 3600000)}h`
        : null],
    ]));
    frag.append(machine);
  }

  if (Array.isArray(data.curses) && data.curses.length) {
    const curses = el("section", { class: "panel" }, [el("h2", { text: "Recent curses" })]);
    curses.append(statRows(data.curses.map((curse) => [
      curse.name,
      `${CURSE_UNITS[curse.metric] ? Math.round(curse.value) + CURSE_UNITS[curse.metric] : curse.value}`
        + ` · ${timeAgo(curse.at)}`,
    ])));
    frag.append(curses);
  }

  if (mapInfo) {
    const where = mapInfo.center ? ` around ${player.name || "the"} last logout` : "";
    const link = el("a", { class: "map-link", href: "map/", text: `Explore the map${where}` });
    const panel = el("section", { class: "panel" }, [link]);
    if (mapInfo.rendered_at) panel.append(el("div", { class: "caption", text: `rendered ${timeAgo(mapInfo.rendered_at)}` }));
    frag.append(panel);
  }

  const activeKey = tooltipKey;
  root.replaceChildren(frag);
  // polling re-renders everything; keep an open tooltip attached to its slot
  if (activeKey) {
    const again = root.querySelector(`[data-key="${activeKey}"]`);
    if (again) again.dispatchEvent(new Event("focus"));
    else hideTooltip();
  }
}

const CURSE_UNITS = { cpu_temp: " c", gpu_temp: " c", mem_percent: "%", uptime_hours: "h" };

function timeAgo(ms) {
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  if (minutes < 48 * 60) return `${Math.round(minutes / 60)}h ago`;
  return `${Math.round(minutes / 1440)} days ago`;
}

// The map is rendered separately and may not exist yet; only link it if it does.
let mapInfo = null;
fetch("map/mc-status.json", { cache: "no-store" })
  .then((response) => (response.ok ? response.json() : null))
  .then((info) => {
    mapInfo = info;
    if (mapInfo && lastData) render(lastData);
  })
  .catch(() => {});

// ---- invite link ----------------------------------------------------------------

// The key arrives as nyannoying.de/#key=… (a fragment never reaches GitHub),
// is remembered on this device, and removed from the address bar.
const KEY_STORAGE = "mc-status-invite";

function readInviteKey() {
  const match = location.hash.match(/(?:^#|&)key=([^&]+)/);
  if (match) {
    const key = decodeURIComponent(match[1]);
    try { localStorage.setItem(KEY_STORAGE, key); } catch { /* private mode: works for this visit */ }
    history.replaceState(null, "", location.pathname + location.search);
    return key;
  }
  try { return localStorage.getItem(KEY_STORAGE); } catch { return null; }
}

function forgetInviteKey() {
  inviteKey = null;
  try { localStorage.removeItem(KEY_STORAGE); } catch { /* nothing stored */ }
}

// ---- live connection --------------------------------------------------------------

// One WebSocket per viewer. The Worker pushes every status and frame as the
// agent sends them, so an open tab costs one request instead of polling.
let inviteKey = readInviteKey();
let lastData = null;
let shotUrl = null;
let socket = null;
let closingOnPurpose = false;
let failures = 0;
let retryTimer = null;
let pollTimer = null;
let hiddenTimer = null;

function connect() {
  clearTimeout(retryTimer);
  if (!inviteKey) {
    showNotice("This page is private", "Ask for an invite link to watch live.", false);
    return;
  }
  if (socket || document.hidden) return;

  closingOnPurpose = false;
  const ws = new WebSocket(`${API.replace(/^http/, "ws")}/live?key=${encodeURIComponent(inviteKey)}`);
  ws.binaryType = "blob";
  socket = ws;

  ws.addEventListener("open", () => {
    failures = 0;
    stopPolling();
  });

  ws.addEventListener("message", async (event) => {
    if (typeof event.data !== "string") {
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotUrl = URL.createObjectURL(event.data);
      if (lastData) render(lastData);
      return;
    }
    const message = JSON.parse(event.data);
    if (message.type === "status") {
      await assetsReady;
      render(message.status);
    } else if (message.type === "empty") {
      showNotice("Nothing reported yet", "The agent hasn't pushed anything. This updates by itself.", false);
    }
  });

  ws.addEventListener("close", (event) => {
    if (socket === ws) socket = null;
    if (event.code === 4001) {
      forgetInviteKey();
      showNotice("This invite link no longer works", "Ask for a new one.", false);
      return;
    }
    if (event.code === 4003) {
      showNotice("Too many people are watching", `Only ${MAX_VIEWERS} can watch at once. Try again in a bit.`);
      return;
    }
    if (closingOnPurpose) return;
    failures += 1;
    if (failures >= 3) startPolling();
    else if (!lastData) showNotice("Can't reach the server", "Retrying by itself.", false);
    retryTimer = setTimeout(connect, Math.min(300000, 2000 * 2 ** (failures - 1)));
  });
}

function disconnect() {
  closingOnPurpose = true;
  clearTimeout(retryTimer);
  if (socket) socket.close(1000, "tab hidden");
  socket = null;
  stopPolling();
}

// Fallback for networks that block WebSockets: a keyed poll once a minute.
async function poll() {
  if (document.hidden || !inviteKey) return;
  try {
    const response = await fetch(`${API}/status?key=${encodeURIComponent(inviteKey)}`, { cache: "no-store" });
    if (response.status === 401) {
      stopPolling();
      forgetInviteKey();
      showNotice("This invite link no longer works", "Ask for a new one.", false);
      return;
    }
    if (response.status === 404) {
      showNotice("Nothing reported yet", "The agent hasn't pushed anything.", false);
      return;
    }
    await assetsReady;
    render(await response.json());
  } catch {
    if (!lastData) showNotice("Can't reach the server", "Retrying by itself.", false);
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(poll, FALLBACK_POLL_MS);
  poll();
}

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    hiddenTimer = setTimeout(disconnect, HIDDEN_GRACE_MS);
  } else {
    clearTimeout(hiddenTimer);
    connect();
  }
});

// keep-alive, answered by Cloudflare without waking anything (and not billed)
setInterval(() => {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send("ping");
}, 45000);

// "3 min ago" labels age locally; no requests
setInterval(() => {
  if (lastData && !document.hidden) render(lastData);
}, 30000);

connect();
</script>
</body>
</html>
