<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status</title>
<meta name="description" content="Live machine and Minecraft status.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root {
  --panel: #c6c6c6;
  --panel-light: #ffffff;
  --panel-dark: #555555;
  --slot-dark: #373737;
  --ink: #3f3f3f;
  --ink-dim: #6d6d6d;
  --xp: #7fb238;
  --xp-dark: #4e7020;
}

* { box-sizing: border-box; }

html {
  background: #2b2118;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 4px, transparent 4px 8px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px);
}

body {
  margin: 0;
  padding: clamp(12px, 4vw, 40px) clamp(10px, 4vw, 24px);
  font-family: "Press Start 2P", ui-monospace, monospace;
  font-size: 10px;
  line-height: 2;
  color: var(--ink);
  -webkit-font-smoothing: none;
}

img { image-rendering: pixelated; }

main { max-width: 560px; margin: 0 auto; }

.panel {
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 14px;
  margin-bottom: 14px;
}

.head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

h1 { font-size: 14px; margin: 0; font-weight: 400; }

.badge {
  padding: 5px 7px;
  color: #173404;
  background: var(--xp);
  border-top: 2px solid #a5d45e;
  border-left: 2px solid #a5d45e;
  border-right: 2px solid var(--xp-dark);
  border-bottom: 2px solid var(--xp-dark);
}
.badge[data-state="offline"] {
  color: #4b1528;
  background: #a94b4b;
  border-top-color: #cf7676;
  border-left-color: #cf7676;
  border-right-color: #6d2626;
  border-bottom-color: #6d2626;
}

h2 {
  font-size: 10px;
  font-weight: 400;
  color: var(--ink-dim);
  margin: 0 0 8px;
}

/* The in-game HUD, laid out in its native 182×39 GUI pixels and scaled as one. */
.viewport {
  background: #1c2230;
  background-image: linear-gradient(#5a7bb5, #9dbbe8 60%, #4d6b3a 60%, #3b5230);
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
  padding: 18px 10px 10px;
  margin-bottom: 14px;
}
.hud {
  position: relative;
  width: min(100%, 546px);
  aspect-ratio: 182 / 39;
  margin: 0 auto;
}
.hud > * { position: absolute; display: block; }
.glyph {
  mask-size: 100% 100%;
  -webkit-mask-size: 100% 100%;
  mask-repeat: no-repeat;
  -webkit-mask-repeat: no-repeat;
}
.swatch { outline: 1px solid rgba(0,0,0,.35); outline-offset: -1px; }
.glint {
  mask-size: 100% 100%;
  -webkit-mask-size: 100% 100%;
  background-image: url("assets/mc/glint.png");
  background-size: 400% 400%;
  mix-blend-mode: screen;
  opacity: .7;
  animation: glint 7s linear infinite;
  pointer-events: none;
}
@keyframes glint {
  from { background-position: 0% 0%; }
  to { background-position: 100% 133%; }
}
@media (prefers-reduced-motion: reduce) {
  .glint { animation: none; }
}

.shot {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #000000;
  border-top: 2px solid var(--slot-dark);
  border-left: 2px solid var(--slot-dark);
  border-right: 2px solid var(--panel-light);
  border-bottom: 2px solid var(--panel-light);
}
.caption { color: var(--ink-dim); margin-top: 6px; }

dl { margin: 0; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 2px solid rgba(85,85,85,.25);
  padding: 3px 0;
}
.row:last-child { border-bottom: 0; }
.row dt { color: var(--ink-dim); }
.row dd { margin: 0; text-align: right; word-break: break-word; }

.map-link { display: block; text-align: center; color: var(--ink); }
.map-link:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }

.disconnect { text-align: center; padding: 22px 14px; }
.disconnect p { margin: 0 0 14px; line-height: 2.2; }
.disconnect p:last-child { margin: 0; color: var(--ink-dim); }

button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border-top: 3px solid var(--panel-light);
  border-left: 3px solid var(--panel-light);
  border-right: 3px solid var(--panel-dark);
  border-bottom: 3px solid var(--panel-dark);
  padding: 10px 16px;
  cursor: pointer;
}
button:hover { background: #d6d6d6; }
button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
button:active {
  border-top-color: var(--panel-dark);
  border-left-color: var(--panel-dark);
  border-right-color: var(--panel-light);
  border-bottom-color: var(--panel-light);
}

.disclaimer {
  max-width: 560px;
  margin: 6px auto 0;
  text-align: center;
  font-size: 8px;
  line-height: 2.2;
  color: #cbbfae;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
</style>
</head>
<body>

<main>
  <h1 class="sr-only">Live status</h1>
  <div id="root" aria-live="polite">
    <section class="panel disconnect">
      <p>Connecting…</p>
    </section>
  </div>
</main>

<footer class="disclaimer">
  NOT AN OFFICIAL MINECRAFT WEBSITE. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
</footer>

<script>
const API = "https://status-api.yourdomain.tld";
const POLL_MS = 15000;
const STALE_MS = 90000;

// Built at deploy time by site/build_assets.py from the Minecraft client jar.
const ASSETS = "assets/mc";
const HUD_W = 182;
const HUD_H = 39;

// Glyph widths for the game font; false when the assets weren't built, in
// which case the page falls back to plain text.
let glyphWidths = null;
const assetsReady = fetch(`${ASSETS}/font/widths.json`)
  .then((response) => (response.ok ? response.json() : false))
  .catch(() => false)
  .then((widths) => { glyphWidths = widths; });

function colorFor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360} 42% 46%)`;
}

function prettyName(id) {
  return id.replace(/^minecraft:/, "").replace(/_/g, " ");
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

// ---- HUD ------------------------------------------------------------------

// Positions are in GUI pixels, converted to percentages of the 182×39 box.
function place(node, x, y, w, h) {
  node.style.left = `${(x / HUD_W) * 100}%`;
  node.style.top = `${(y / HUD_H) * 100}%`;
  node.style.width = `${(w / HUD_W) * 100}%`;
  node.style.height = `${(h / HUD_H) * 100}%`;
  return node;
}

function sprite(name, x, y, w, h) {
  return place(el("img", { src: `${ASSETS}/hud/${name}.png`, alt: "" }), x, y, w, h);
}

function fill(x, y, w, h, color) {
  const node = place(el("div"), x, y, w, h);
  node.style.background = color;
  return node;
}

function masked(node, url) {
  node.style.maskImage = `url("${url}")`;
  node.style.webkitMaskImage = `url("${url}")`;
  return node;
}

function textWidth(text) {
  let width = 0;
  for (const char of text) width += (glyphWidths[char] ?? 5) + 1;
  return width;
}

function drawText(hud, text, x, y, color) {
  let cursor = x;
  for (const char of text) {
    const width = glyphWidths[char];
    if (width === undefined) { cursor += 6; continue; }
    const glyph = masked(place(el("div", { class: "glyph" }), cursor, y, width, 8),
      `${ASSETS}/font/${char.charCodeAt(0)}.png`);
    glyph.style.background = color;
    hud.append(glyph);
    cursor += width + 1;
  }
}

function drawShadowText(hud, text, x, y) {
  drawText(hud, text, x + 1, y + 1, "#3f3f3f");
  drawText(hud, text, x, y, "#ffffff");
}

function drawItem(hud, item) {
  const x = 3 + item.slot * 20;
  const y = 20;
  const label = `${prettyName(item.id)}${item.count > 1 ? ` ×${item.count}` : ""}`;
  const name = item.id.startsWith("minecraft:") ? item.id.slice(10) : null;
  const url = `${ASSETS}/item/${name}.png`;

  const swatch = () => {
    const node = place(el("div", { class: "swatch", title: label }), x + 2, y + 2, 12, 12);
    node.style.background = colorFor(item.id);
    return node;
  };

  if (name) {
    const icon = place(el("img", { src: url, alt: "", title: label }), x, y, 16, 16);
    icon.addEventListener("error", () => icon.replaceWith(swatch()), { once: true });
    hud.append(icon);
    if (item.enchanted) hud.append(masked(place(el("div", { class: "glint" }), x, y, 16, 16), url));
  } else {
    hud.append(swatch());
  }

  if (item.count > 1) {
    const text = String(item.count);
    drawShadowText(hud, text, x + 19 - 2 - textWidth(text), y + 9);
  }

  // Same maths as the game: 13px bar, green → red by hue.
  if (item.damage && item.max_damage) {
    const left = Math.max(0, (item.max_damage - item.damage) / item.max_damage);
    const width = Math.round(13 - (item.damage * 13) / item.max_damage);
    hud.append(fill(x + 2, y + 13, 13, 2, "#000000"));
    hud.append(fill(x + 2, y + 13, Math.max(0, width), 1, `hsl(${Math.round(left * 120)} 100% 50%)`));
  }
}

function hudNode(player) {
  const health = Math.ceil(player.health ?? 0);
  const food = player.foodlevel ?? 0;
  const level = player.xplevel ?? 0;
  const hotbar = player.hotbar || [];

  const hud = el("div", {
    class: "hud",
    role: "img",
    "aria-label": `${health / 2} of 10 hearts, hunger ${food / 2} of 10, level ${level}. Hotbar: `
      + (hotbar.map((item) => `${prettyName(item.id)} ×${item.count}`).join(", ") || "empty"),
  });

  for (let i = 0; i < 10; i++) {
    const x = i * 8;
    hud.append(sprite("heart_container", x, 0, 9, 9));
    if (i * 2 + 1 < health) hud.append(sprite("heart_full", x, 0, 9, 9));
    else if (i * 2 + 1 === health) hud.append(sprite("heart_half", x, 0, 9, 9));
  }

  for (let i = 0; i < 10; i++) {
    const x = HUD_W - i * 8 - 9;
    hud.append(sprite("food_empty", x, 0, 9, 9));
    if (i * 2 + 1 < food) hud.append(sprite("food_full", x, 0, 9, 9));
    else if (i * 2 + 1 === food) hud.append(sprite("food_half", x, 0, 9, 9));
  }

  hud.append(sprite("xp_background", 0, 10, 182, 5));
  const progress = Math.min(182, Math.floor((player.xpp ?? 0) * 183));
  if (progress > 0) {
    const clip = place(el("div"), 0, 10, progress, 5);
    clip.style.overflow = "hidden";
    const bar = el("img", { src: `${ASSETS}/hud/xp_progress.png`, alt: "" });
    bar.style.cssText = `position:absolute;left:0;top:0;height:100%;width:${(182 / progress) * 100}%`;
    clip.append(bar);
    hud.append(clip);
  }
  if (level > 0) {
    const text = String(level);
    const x = Math.floor((HUD_W - textWidth(text)) / 2);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) drawText(hud, text, x + dx, 4 + dy, "#000000");
    drawText(hud, text, x, 4, "#80ff20");
  }

  hud.append(sprite("hotbar", 0, 17, 182, 22));
  const selected = player.selecteditemslot ?? 0;
  hud.append(sprite("hotbar_selection", -1 + selected * 20, 16, 24, 23));
  for (const item of hotbar) drawItem(hud, item);

  return el("div", { class: "viewport" }, [hud]);
}

// Used when the icon assets weren't built: the same facts, as text.
function plainStats(player) {
  return statRows([
    ["health", `${Math.ceil(player.health ?? 0)} / 20`],
    ["food", `${player.foodlevel ?? 0} / 20`],
    ["level", player.xplevel ?? 0],
    ["hotbar", (player.hotbar || []).map((item) => `${prettyName(item.id)} ×${item.count}`).join(", ") || "empty"],
  ]);
}

// ---- panels -----------------------------------------------------------------

function statRows(pairs) {
  const list = el("dl");
  for (const [label, value] of pairs) {
    if (value === null || value === undefined || value === "") continue;
    list.append(el("div", { class: "row" }, [
      el("dt", { text: label }),
      el("dd", { text: String(value) }),
    ]));
  }
  return list;
}

function disconnectPanel(title, detail) {
  const panel = el("section", { class: "panel disconnect" }, [
    el("p", { text: title }),
    el("p", { text: detail }),
  ]);
  const retry = el("button", { type: "button", text: "Try again" });
  retry.addEventListener("click", () => refresh());
  panel.append(retry);
  return panel;
}

function render(data) {
  const root = document.getElementById("root");
  const frag = document.createDocumentFragment();
  const age = Date.now() - (data.received_at || data.generated_at || 0);

  if (age > STALE_MS) {
    root.replaceChildren(disconnectPanel(
      "Connection lost",
      `Last heard from the machine ${Math.round(age / 60000)} min ago.`
    ));
    return;
  }

  const player = data.player || {};
  const system = data.system || {};

  const status = el("section", { class: "panel" });
  const badge = el("span", { class: "badge", text: player.online ? "in game" : "not playing" });
  badge.dataset.state = player.online ? "online" : "offline";
  status.append(el("div", { class: "head" }, [
    el("h1", { text: player.name || "status" }),
    badge,
  ]));

  if (player.online) {
    status.append(glyphWidths ? hudNode(player) : plainStats(player));
    const position = player.position
      ? player.position.map((n) => Math.round(n)).join("  ")
      : "hidden";
    status.append(statRows([
      ["x y z", position],
      ["dimension", (player.dimension || "").replace(/^minecraft:/, "")],
    ]));
  } else {
    status.append(el("p", { text: "No world loaded right now." }));
  }
  frag.append(status);

  if (data.screenshot_at) {
    const shot = el("section", { class: "panel" }, [
      el("h2", { text: "Last thing seen" }),
    ]);
    const image = el("img", {
      class: "shot",
      alt: "The most recent in-game screenshot.",
      loading: "lazy",
    });
    image.src = `${API}/shot?t=${data.screenshot_at}`;
    shot.append(image);
    const when = new Date(data.screenshot_at);
    shot.append(el("div", { class: "caption", text: when.toLocaleString() }));
    frag.append(shot);
  }

  if (Object.keys(system).length) {
    const machine = el("section", { class: "panel" }, [el("h2", { text: "The machine" })]);
    machine.append(statRows([
      ["os", system.os],
      ["kernel", system.kernel],
      ["desktop", system.de],
      ["cpu", system.cpu],
      ["cpu temp", system.cpu_temp ? `${Math.round(system.cpu_temp)} c` : null],
      ["gpu", system.gpu],
      ["gpu temp", system.gpu_temp ? `${Math.round(system.gpu_temp)} c` : null],
      ["uptime", system.uptime && system.uptime.uptime
        ? `${Math.floor(system.uptime.uptime / 3600000)}h`
        : null],
    ]));
    frag.append(machine);
  }

  if (Array.isArray(data.curses) && data.curses.length) {
    const curses = el("section", { class: "panel" }, [el("h2", { text: "Recent curses" })]);
    curses.append(statRows(data.curses.map((curse) => [
      curse.name,
      `${CURSE_UNITS[curse.metric] ? Math.round(curse.value) + CURSE_UNITS[curse.metric] : curse.value}`
        + ` · ${timeAgo(curse.at)}`,
    ])));
    frag.append(curses);
  }

  if (mapAvailable) {
    const link = el("a", { class: "map-link", href: "map/", text: "Open the world map" });
    frag.append(el("section", { class: "panel" }, [link]));
  }

  root.replaceChildren(frag);
}

const CURSE_UNITS = { cpu_temp: " c", gpu_temp: " c", mem_percent: "%", uptime_hours: "h" };

function timeAgo(ms) {
  const minutes = Math.round((Date.now() - ms) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  return `${Math.round(minutes / 60)}h ago`;
}

// The map is rendered separately and may not exist yet; only link it if it does.
let mapAvailable = false;
fetch("map/settings.json", { method: "HEAD" })
  .then((response) => {
    mapAvailable = response.ok;
    if (mapAvailable) refresh();
  })
  .catch(() => {});

async function refresh() {
  try {
    await assetsReady;
    const response = await fetch(`${API}/status`, { cache: "no-store" });
    if (response.status === 404) {
      document.getElementById("root").replaceChildren(
        disconnectPanel("Nothing reported yet", "The agent has not pushed anything.")
      );
      return;
    }
    if (!response.ok) throw new Error(`http ${response.status}`);
    render(await response.json());
  } catch (err) {
    document.getElementById("root").replaceChildren(
      disconnectPanel("Can't reach the server", "Check back in a moment.")
    );
  }
}

refresh();
setInterval(() => {
  if (!document.hidden) refresh();
}, POLL_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});
</script>
</body>
</html>
